name: Проверка APK на эмуляторе

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-apk.yml', '.github/apk-check.sh']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Скачать последний APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk \
            $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '[.[] | select(.tagName|startswith("build-"))][0].tagName')
          ls -la apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запустить эмулятор и приложение
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/apk-check.sh

      - name: Опубликовать результаты
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-check
          name: Проверка APK (служебное)
          prerelease: true
          make_latest: false
          body: Скриншоты автоматической проверки APK на эмуляторе Android 11.
          files: out/*
