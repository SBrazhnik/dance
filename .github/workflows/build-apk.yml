name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Адрес веб-приложения (https://script.google.com/macros/s/…/exec). Пусто — взять из переменной APP_URL'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Подготовить ключ подписи (если задан в секретах)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Собрать APK
        env:
          APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          gradle -p android assembleRelease -PappUrl="$APP_URL" --no-daemon --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/DanceClub-${{ github.run_number }}.apk"
          if [ -n "$APP_URL" ]; then echo "URL_NOTE=Адрес приложения встроен." >> "$GITHUB_ENV"; else echo "URL_NOTE=Адрес приложения не задан — его нужно будет ввести при первом запуске." >> "$GITHUB_ENV"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DanceClub-apk
          path: out/*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Приложение, сборка ${{ github.run_number }}
          body: |
            Клуб корпоративных бальных танцев — приложение для Android.
            ${{ env.URL_NOTE }}
            Скачайте файл .apk ниже на телефон и установите (разрешите установку из этого источника).
          files: out/*.apk
          make_latest: true
