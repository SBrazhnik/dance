<style>
.cl-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cl-stars{color:#e0a100;letter-spacing:1px;white-space:nowrap}
.cl-dist{display:grid;grid-template-columns:28px 1fr 34px;gap:4px 8px;align-items:center;font-size:12px;margin-top:8px}
.cl-dist .bar{height:7px}
.cl-cm{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:13px}
.cl-week{display:grid;grid-template-columns:110px repeat(7,minmax(120px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);min-width:960px}
.cl-week>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:54px}
.cl-week .h{background:var(--soft);font-weight:600;font-size:13px;min-height:auto}
.cl-week .today{background:var(--gold2)}
.cl-it{font-size:12px;border-radius:7px;padding:4px 6px;margin-bottom:4px;background:var(--soft);border-left:3px solid var(--navy3);line-height:1.25}
.cl-it.rent{border-left-color:var(--gold);background:#fbf3df}
.cl-it.bad{border-left-color:var(--bad);background:var(--badbg, #fde8e8)}
.cl-it b{font-weight:650}
.cl-plan{display:grid;grid-template-columns:150px 110px 1fr 36px;gap:6px;margin-bottom:6px}
.cl-fest{display:flex;gap:14px;align-items:flex-start}
.cl-date{width:58px;flex:none;text-align:center;border-radius:12px;background:var(--navy);color:#fff;padding:6px 0;line-height:1.1}
.cl-date b{display:block;font-size:22px}.cl-date span{font-size:11px;text-transform:uppercase;opacity:.85}
.cl-pos{color:var(--ok)}.cl-neg{color:var(--bad)}
.cl-yt{display:block;margin-top:6px;max-width:260px;border-radius:10px;overflow:hidden;position:relative}
.cl-yt img{width:100%;display:block}
.cl-yt:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
a.btn{text-decoration:none}

.md-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.md-it{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;display:flex;flex-direction:column}
.md-th{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.md-th .md-b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.md-tx{padding:7px 9px;font-size:12px;line-height:1.3}
.md-view img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
.md-view iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
.md-q{font-size:12px;margin-top:6px}
.hl-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-bottom:12px}
.hl-grid.big .hl-ph{height:190px}
.hl-card.off{opacity:.6}
.hl-d{margin-top:4px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hl-ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hl-cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:8px;padding:3px 8px;display:flex;gap:4px;align-items:center}
.hl-page{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.hl-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hl-th{width:76px;height:56px;border-radius:9px;background:var(--soft) center/cover no-repeat;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.hl-th.on{border-color:#7C5CE6}
.hl-th.add{border:1px dashed var(--line)}
.hl-desc{white-space:pre-wrap;line-height:1.55}
@media (max-width:900px){.hl-page{grid-template-columns:1fr}}
.hl-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s}
.hl-card:hover{border-color:var(--navy3)}
.hl-ph{height:150px;background:var(--soft) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.hl-big{height:min(52vh,420px);border-radius:12px;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#hlpv{height:200px}
.hl-area{position:absolute;left:10px;bottom:10px;background:#7C5CE6;color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:3px 9px}
.hl-b{padding:10px 12px;line-height:1.35}
.hl-ed{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.5);color:#fff;width:34px;height:34px;align-items:center;justify-content:center}

<script>
I.cam = '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>';
I.users = '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>';

const CL = {
  async load(force) {
    if (S.C && !force) return S.C;
    S.C = await call('clubLoad', {}, true);
    return S.C;
  },
  halls() { return String((S.D.settings || {}).halls || '').split(',').map(x => x.trim()).filter(Boolean); },
  stars(v) { const n = Math.round(+v || 0); return `<span class="cl-stars">${'★'.repeat(n)}${'☆'.repeat(Math.max(0, 5 - n))}</span>`; },
  first(n) { const p = String(n || '').trim().split(/\s+/); return p[1] || p[0] || ''; },
  copy(text, el) {
    return navigator.clipboard.writeText(text).then(() => toast('Скопировано')).catch(() => {
      if (el) { const s = getSelection(), r = document.createRange(); r.selectNodeContents(el); s.removeAllRanges(); s.addRange(r); }
      toast('Выделено — скопируйте вручную');
    });
  },
  url(path) { return 'https:' + '/' + '/' + path; },
  yt(u) { const m = String(u || '').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/); return m ? m[1] : ''; },
};
async function clRefresh() { await CL.load(true); await TL.load(true); if (S.route[0] === 'tools' && $('#tlb')) TLV[S.route[1] || TL.tabs()[0][0]](); }

const TOOL_TABS = {bot: 'Telegram-бот', renew: 'Продления', lost: 'Удержание', rate: 'Оценки', fests: 'Мероприятия', halls: 'Залы', subst: 'Замена тренера', money: 'Финансы',
  media: 'Фото и видео', pair: 'Подбор пары', passport: 'Паспорт танцора', league: 'Корпоративная лига', hr: 'Отчёт для HR', my: 'Мой прогресс', tg: 'Telegram', access: 'Доступ'};
const TOOL_FOR = {
  admin: ['bot', 'renew', 'lost', 'rate', 'fests', 'halls', 'subst', 'money', 'media', 'pair', 'passport', 'league', 'hr', 'access'],
  manager: ['bot', 'renew', 'lost', 'rate', 'fests', 'halls', 'subst', 'money', 'media', 'pair', 'passport', 'league', 'hr'],
  trainer: ['pair', 'passport', 'league', 'halls', 'media', 'tg'],
  client: ['my', 'league', 'media', 'tg'],
};
const toolAcc = () => (S.D && S.D.toolsAccess) || {};
const hasTool = k => role() === 'admin' || (toolAcc()[role()] || []).includes(k);
TL.tabs = () => (TOOL_FOR[role()] || []).filter(hasTool).map(k => [k, k === 'league' && role() !== 'admin' && role() !== 'manager' ? 'Лига' : TOOL_TABS[k]]);
(function () {
  const pg = PAGES.find(p => p.k === 'tools');
  if (pg) Object.defineProperty(pg, 'r', {get: () => ['admin'].concat(['manager', 'trainer', 'client'].filter(r => (toolAcc()[r] || []).length)), configurable: true});
  const baseTools = VIEWS.tools;
  VIEWS.tools = tab => {
    if (!TL.tabs().length) { $('#main').innerHTML = `<div class="head"><h1>Инструменты</h1></div><div class="card">${empty('Администратор пока не открыл вам инструменты')}</div>`; return; }
    baseTools(tab);
  };
})();
const ACC_NOTE = {
  bot: 'рассылки, подключение людей к боту, настройки уведомлений (токен бота меняет только администратор)',
  renew: 'кому продлевать, напоминания и QR для оплаты, реквизиты', lost: 'кто перестал ходить, «позвать обратно»', rate: 'оценки тренеров от учеников',
  fests: 'мероприятия, участники, приглашения и итоги', halls: 'календарь залов (тренер видит только свои занятия)', subst: 'замена и отмена занятий тренеров',
  money: 'доходы, расходы, прибыль — финансы клуба', media: 'фото и видео с занятий, турниров и мероприятий (ученик видит только те, где он отмечен)', pair: 'подбор пары и тренера (тренер — среди своих учеников)', passport: 'уровни и дневник (тренер — только своим ученикам)',
  league: 'рейтинг компаний (ученик видит своё место и топ‑10)', hr: 'отчёт для HR и ссылки для компаний', my: 'свой паспорт танцора и анкета «ищу пару»', tg: 'подключить свой Telegram',
};
TLV.access = () => {
  const acc = JSON.parse(JSON.stringify(toolAcc()));
  const roles = [['manager', 'Менеджер'], ['trainer', 'Тренер'], ['client', 'Ученик']];
  const keys = [...new Set(TOOL_FOR.manager.concat(TOOL_FOR.trainer, TOOL_FOR.client))];
  $('#tlb').innerHTML = `<p class="small muted" style="margin-top:0">Отметьте, какие вкладки «Инструментов» видят другие роли. Администратору доступно всё. Раздел «Инструменты» появится в меню у роли, как только ей открыта хотя бы одна вкладка. Права проверяются и на сервере: закрытую вкладку нельзя открыть в обход.</p>
    <div class="row" style="gap:8px;margin-bottom:10px"><button class="btn sm" data-pre="none">Только администратор</button><button class="btn sm" data-pre="mgr">Менеджеру всё, кроме финансов</button><button class="btn sm" data-pre="std">Рекомендуемое</button></div>
    <div class="tw"><table class="t"><thead><tr><th>Вкладка</th>${roles.map(r => `<th style="text-align:center">${r[1]}</th>`).join('')}<th>Что внутри</th></tr></thead><tbody>
    ${keys.map(k => `<tr><td><b>${esc(TOOL_TABS[k])}</b></td>${roles.map(r => `<td style="text-align:center">${TOOL_FOR[r[0]].includes(k) ? `<input type="checkbox" data-acc="${r[0]}|${k}" ${(acc[r[0]] || []).includes(k) ? 'checked' : ''} style="width:20px;height:20px">` : '<span class="muted">—</span>'}</td>`).join('')}<td class="small muted">${esc(ACC_NOTE[k] || '')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn pri" id="accs">Сохранить доступ</button></div>`;
  const set = o => { $$('[data-acc]').forEach(c => { const [r, k] = c.dataset.acc.split('|'); c.checked = (o[r] || []).includes(k); }); };
  $$('[data-pre]').forEach(b => b.onclick = () => set(b.dataset.pre === 'none' ? {} : b.dataset.pre === 'mgr' ? {manager: TOOL_FOR.manager.filter(k => k !== 'money')}
    : {manager: TOOL_FOR.manager.filter(k => k !== 'money'), trainer: ['passport', 'league', 'halls', 'media', 'tg'], client: ['my', 'league', 'media', 'tg']}));
  $('#accs').onclick = async () => {
    const o = {manager: [], trainer: [], client: []};
    $$('[data-acc]').forEach(c => { if (c.checked) { const [r, k] = c.dataset.acc.split('|'); o[r].push(k); } });
    try { S.D.toolsAccess = await call('saveToolsAccess', {access: o}); toast('Доступ сохранён. У пользователей изменится после обновления страницы'); } catch (e) { fail(e); }
  };
};

function payQrText(sum, purpose, payer) {
  const C = S.C.settings, clean = v => String(v || '').replace(/\|/g, ' ').trim();
  if (!C.pay_acc || !C.pay_bic || !C.pay_name) return '';
  const f = ['ST00012', 'Name=' + clean(C.pay_name), 'PersonalAcc=' + clean(C.pay_acc), 'BankName=' + clean(C.pay_bank), 'BIC=' + clean(C.pay_bic), 'CorrespAcc=' + clean(C.pay_corr || '0')];
  if (C.pay_inn) f.push('PayeeINN=' + clean(C.pay_inn));
  if (C.pay_kpp) f.push('KPP=' + clean(C.pay_kpp));
  if (+sum > 0) f.push('Sum=' + Math.round(+sum * 100));
  if (purpose) f.push('Purpose=' + clean(purpose).slice(0, 210));
  if (payer) f.push('LastName=' + clean(payer).split(/\s+/)[0]);
  return f.join('|');
}
async function clQr(text, cell) {
  await tlQrLib();
  const q = qrcode(0, 'M'); q.addData(unescape(encodeURIComponent(text))); q.make();
  const n = q.getModuleCount(), pad = 4, size = (n + pad * 2) * cell;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + pad) * cell, (r + pad) * cell, cell, cell);
  c.style.width = '100%'; c.style.height = 'auto'; c.style.imageRendering = 'pixelated';
  return c;
}
function payModal(o) {
  const C = S.C.settings;
  const bg = modal('Оплата: ' + esc(o.name), `<div class="fg">
      ${fld('Сумма, ₽', inp('sum', o.price || '', 'type="number" min="0" id="pqs"'))}
      ${fld('Назначение', inp('purpose', 'Оплата абонемента' + (o.title ? ' «' + o.title + '»' : '') + ', ' + o.name, 'id="pqp"'), 'full')}</div>
    <div class="tl-qr" style="margin-top:12px"><div class="tl-qrbox" id="pqr">${empty('QR…')}</div>
      <div class="grow small">${C.pay_acc ? `Ученик наводит камеру банковского приложения на QR — сумма и реквизиты подставятся сами.<br><br>${esc(C.pay_name)}<br>р/с ${esc(C.pay_acc)}<br>${esc(C.pay_bank)}, БИК ${esc(C.pay_bic)}` : '<span style="color:var(--bad)">Реквизиты для QR не заполнены — откройте «Реквизиты для оплаты» на вкладке «Продления».</span>'}
      ${C.pay_link ? `<br><br>Ссылка СБП: <span class="tl-link" style="display:inline-block;padding:2px 6px">${esc(C.pay_link)}</span>` : ''}</div></div>`,
  [{t: 'Закрыть'}, {t: ic('dl') + 'Скачать QR', cls: 'pri', fn: async () => {
    const t = payQrText($('#pqs', bg).value, $('#pqp', bg).value, o.name); if (!t) throw new Error('Заполните реквизиты');
    const c = await clQr(t, 10); c.toBlob(b => saveBlob('Оплата — ' + o.name + '.png', b), 'image/png'); return false; }}], {wide: true});
  const draw = () => {
    const t = payQrText($('#pqs', bg).value, $('#pqp', bg).value, o.name);
    if (!t) return;
    clQr(t, 6).then(c => { const b = $('#pqr', bg); if (b) { b.innerHTML = ''; b.appendChild(c); } }).catch(e => { $('#pqr', bg).innerHTML = esc(e.message); });
  };
  bg.addEventListener('input', () => { clearTimeout(bg._t); bg._t = setTimeout(draw, 300); });
  draw();
}
function payForm() {
  const C = S.C.settings;
  modal('Реквизиты для оплаты', `<p class="small muted" style="margin-top:0">По ним строится QR-код для оплаты из банковского приложения (стандарт ГОСТ 56042, понимают все банки РФ). Ссылку СБП (например, qr.nspk.ru/…) можно получить в своём банке — тогда бот будет присылать её ученикам.</p><div class="fg">
    ${fld('Получатель (как в банке)', inp('pay_name', C.pay_name), 'full')}
    ${fld('Расчётный счёт', inp('pay_acc', C.pay_acc, 'inputmode="numeric"'))}${fld('БИК', inp('pay_bic', C.pay_bic, 'inputmode="numeric"'))}
    ${fld('Банк', inp('pay_bank', C.pay_bank))}${fld('Корр. счёт', inp('pay_corr', C.pay_corr, 'inputmode="numeric"'))}
    ${fld('ИНН', inp('pay_inn', C.pay_inn, 'inputmode="numeric"'))}${fld('КПП', inp('pay_kpp', C.pay_kpp, 'inputmode="numeric"'))}
    ${fld('Ссылка для оплаты по СБП (необязательно)', inp('pay_link', C.pay_link, 'placeholder="' + CL.url('qr.nspk.ru/…') + '"'), 'full')}
    ${fld('Напоминать о конце срока абонемента за, дней', inp('renew_days', C.renew_days, 'type="number" min="1" max="30"'))}
    <div style="align-self:end">${chk('bot_renew', 'Бот сам напоминает о конце срока', C.bot_renew === 'true')}</div></div>`,
  [{t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => { const v = vals(m); v.bot_renew = v.bot_renew ? 'true' : 'false'; await call('savePay', v); toast('Сохранено'); await clRefresh(); }}], {wide: true});
}

const RENEW_R = {ended: ['Часы закончились', 'bad'], expired: ['Срок истёк', 'bad'], low: ['Мало часов', 'warn'], date: ['Скоро конец срока', 'warn']};
TLV.renew = () => {
  const my = S.pageSeq;
  $('#tlb').innerHTML = empty('Загрузка…');
  Promise.all([CL.load(), call('renewals', {}, true)]).then(([C, list]) => {
    if (S.pageSeq !== my || !$('#tlb')) return;
    const sumNeed = sum(list, r => r.price);
    $('#tlb').innerHTML = `<div class="row" style="margin-bottom:10px"><p class="small muted grow" style="margin:0">Ученики, у которых заканчиваются часы или срок абонемента, а нового абонемента ещё нет. Напомните через бота, покажите QR для оплаты или сразу оформите продление.</p>
        <button class="btn" id="rnp">${ic('cog')}Реквизиты для оплаты</button></div>
      <div class="kpis"><div class="kpi"><b>${list.length}</b><span>кому продлевать</span></div><div class="kpi"><b>${list.filter(r => r.reason === 'ended' || r.reason === 'expired').length}</b><span>уже без часов или срока</span></div>
        <div class="kpi"><b>${money(sumNeed)}</b><span>потенциальная выручка продлений</span></div><div class="kpi"><b>${list.filter(r => r.tg).length}</b><span>можно напомнить в Telegram</span></div></div>
      <div class="tw sect"><table class="t"><thead><tr><th>Ученик</th><th>Абонемент</th><th class="n">Осталось</th><th>До</th><th>Почему</th><th>Напоминали</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="avatar c sm" data-av="client:${r.clientId}">${initials(r.name)}</div><div><a class="click" data-c="${r.clientId}"><b>${esc(r.name)}</b></a><div class="small muted">${esc(r.company || '')}${r.phone ? ' · <a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>' : ''}</div></div></div></td>
        <td>${esc(r.title)}${r.price ? `<div class="small muted">${money(r.price)}</div>` : ''}</td><td class="n">${fh(r.remaining)} ч</td><td class="nowrap">${fd(r.endDate) || '—'}</td>
        <td><span class="badge ${RENEW_R[r.reason][1]}">${RENEW_R[r.reason][0]}</span></td><td class="small nowrap">${r.lastRemind ? fd(r.lastRemind) : '—'}</td>
        <td class="nowrap"><button class="btn sm" data-rr="${r.subId}" ${r.tg && C.bot ? '' : 'disabled title="Ученик не подключил бота"'}>${ic('send')}Напомнить</button>
          <button class="btn sm" data-rq="${r.subId}">QR</button><button class="btn sm pri" data-rs="${r.subId}">${ic('plus')}Продлить</button></td></tr>`).join('') || `<tr><td colspan="7">${empty('Все абонементы в порядке 🎉')}</td></tr>`}
      </tbody></table></div>`;
    $('#rnp').onclick = payForm;
    $$('#tlb [data-c]').forEach(a => a.onclick = () => { S.prev = ['tools', 'renew']; go('client', a.dataset.c); });
    $$('[data-rq]').forEach(b => b.onclick = () => payModal(list.find(r => r.subId === b.dataset.rq)));
    $$('[data-rs]').forEach(b => b.onclick = () => { const r = list.find(x => x.subId === b.dataset.rs); const s = S.m.subs[r.subId] || {}; subForm({clientId: r.clientId, title: r.title, hours: r.hours, price: r.price, trainerId: s.trainerId || ''}); });

function hmMin(t) { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : -1; }
const WHOLE = h => /весь|все |целиком|клуб/i.test(String(h || ''));
function hallItems(from, to, skip) {
  const out = [];
  (S.D.slots || []).forEach(s => {
    if (s.status === 'cancelled' || s.date < from || s.date > to || (skip && skip.kind === 'slot' && skip.id === s.id)) return;
    const a = hmMin(s.time);
    out.push({kind: 'slot', id: s.id, date: s.date, a, b: a >= 0 ? a + Math.round((+s.hours || 1) * 60) : -1, hall: s.hall || '', title: s.title, who: tName(s.trainerId), time: s.time});
  });
  (S.D.rent || []).forEach(r => {
    if (skip && skip.kind === 'rent' && skip.id === r.id) return;
    const end = rentEnd(r);
    if (r.date > to || end < from) return;
    for (let d = r.date < from ? from : r.date; d <= end && d <= to; d = addDays(d, 1)) {
      const a = hmMin(r.time), whole = r.unit === 'day' && (a < 0 || !(+r.hours));
      out.push({kind: 'rent', id: r.id, date: d, a: whole ? 0 : a, b: whole ? 1440 : a >= 0 ? a + Math.round((+r.hours || 1) * 60) : -1, hall: r.hall || '', title: 'Аренда: ' + r.renter, who: r.renter, time: whole ? 'весь день' : r.time});
    }
  });
  return out;
}
function hallClash(x, y) {
  if (x.date !== y.date || x.a < 0 || y.a < 0 || x.b <= y.a || y.b <= x.a) return false;
  if (WHOLE(x.hall) || WHOLE(y.hall)) return true;
  if (!x.hall || !y.hall) return false;
  return x.hall === y.hall;
}
function hallPar(h) { return Math.max(1, +((S.D.hallPar || {})[h]) || 1); }
function hallOver(m, all) {
  const xs = all.filter(x => x !== m && hallClash(m, x));
  if (!xs.length) return [];
  if (m.kind === 'rent' || WHOLE(m.hall) || xs.some(x => x.kind === 'rent' || WHOLE(x.hall))) return xs;
  const par = hallPar(m.hall);
  for (let t = m.a; t < m.b; t += 5) if (xs.filter(x => x.a <= t && t < x.b).length + 1 > par) return xs;
  return [];
}
function hallConflicts(o) {
  const from = o.date, to = o.kind === 'rent' && o.unit === 'day' ? (o.endDate || o.date) : o.date;
  if (!from) return [];
  const all = hallItems(from, to, {kind: o.kind, id: o.id});
  const mine = [];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const a = hmMin(o.time), whole = o.kind === 'rent' && o.unit === 'day' && (a < 0 || !(+o.hours));
    mine.push({kind: o.kind, date: d, a: whole ? 0 : a, b: whole ? 1440 : a >= 0 ? a + Math.round((+o.hours || 1) * 60) : -1, hall: o.hall || ''});
  }
  const res = [];
  mine.forEach(m => hallOver(m, all).forEach(x => res.push(fd(x.date).slice(0, 5) + ' ' + (x.time || '') + ' ' + x.title + (x.hall ? ' (' + x.hall + ')' : ''))));
  return [...new Set(res)].slice(0, 6);
}

  async load(force) {
    if (S.HI && !force) return S.HI;

  },
  info(name) { return (S.HI || []).find(h => h.name === name) || null; },
  label(name) { const h = HL.info(name); return name + (h && h.area ? ' · ' + h.area + ' м²' : ''); },
  canEdit() { return ['admin', 'manager'].includes(role()); },
  /** Фото зала № n: из памяти устройства, иначе с сервера; уменьшенную копию делает браузер и отдаёт серверу для остальных. */
  async pic(h, n) {
    n = n || 0;
    if (!h || !(h.pics > n)) return '';
    const key = 'hall:' + h.id + ':' + n + ':' + h.ver;
    S.hpc = S.hpc || {};
    if (S.hpc[key]) return S.hpc[key];
    let url = await fontGet(key);
    if (!url) {
      const r = await call('hallPhoto', {id: h.id, n}, true);
      if (!r || !r.data) return '';
      url = 'data:' + r.mime + ';base64,' + r.data;
      if (!r.thumb) {
        url = await HL.shrink(url, 1100);
        if (role() !== 'client') call('hallThumb', {id: h.id, n, data: url}, true).catch(() => {});
      }
      fontPut(key, url);
    }
    return (S.hpc[key] = url);
  },
  shrink(src, w) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, w / im.naturalWidth);
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      im.onerror = () => res(src);
      im.src = src;
    });
  },
  fill(root) {
    $$('[data-hp]', root).forEach(el => {
      const h = (S.HI || []).find(x => x.id === el.dataset.hp);

      .filter(Boolean).map(x => `<span class="badge">${esc(x)}</span>`).join(' ');
  },
};

TLV.halls = () => {

      ${rows.map(h => `<div class="h">${esc(h || 'Без зала')}${h && hallPar(h) > 1 ? `<div class="small muted" style="font-weight:400">до ${hallPar(h)} занятий сразу</div>` : ''}</div>${days.map(d => `<div class="${d === today() ? 'today' : ''}">${cell(h, d)}</div>`).join('')}`).join('')}</div></div>

function jpegFit(src, w, h, max) {
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  let q = 0.8, d = c.toDataURL('image/jpeg', q);

    if (String(f.type).indexOf('video/') === 0) {

}

  const my = S.pageSeq;
  const prep = role() === 'client' ? Promise.resolve() : CL.load().catch(() => null);
  $('#tlb').innerHTML = empty('Загрузка…');
  prep.then(() => call('mediaList', {festId: ui.festId, clientId: ui.clientId, type: ui.type, limit: 120}, true)).then(r => {
    if (S.pageSeq !== my || !$('#tlb')) return;
    const fests = (S.C && S.C.fests) || [];
    $('#tlb').innerHTML = `<div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <div class="chips">${[['', 'Всё'], ['photo', 'Фото'], ['video', 'Видео'], ['link', 'Ссылки']].map(x => `<span class="chip ${ui.type === x[0] ? 'on' : ''}" data-mt="${x[0]}">${x[1]}</span>`).join('')}</div>
        ${role() !== 'client' ? `<select class="inp" id="mdfs" style="width:auto;max-width:260px"><option value="">Все мероприятия</option>${fests.map(f => `<option value="${f.id}" ${ui.festId === f.id ? 'selected' : ''}>${esc(fd(f.date) + ' ' + f.title)}</option>`).join('')}</select>
        <select class="inp" id="mdcs" style="width:auto;max-width:220px">${clOpts(null, 'Все ученики').map(x => `<option value="${x[0]}" ${ui.clientId === x[0] ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}</select>` : ''}
        <span class="spacer"></span>
        ${r.folderUrl ? `<a class="btn sm" href="${esc(r.folderUrl)}" target="_blank" rel="noopener">${ic('ext')}Папка на Диске</a><a class="btn sm" href="${esc(r.sheetUrl)}" target="_blank" rel="noopener">${ic('ext')}Таблица «Медиа»</a>` : ''}
        ${canAddMedia() ? `<button class="btn pri" id="mdadd">${ic('plus')}Добавить</button>` : ''}</div>
      ${role() === 'client' ? '<p class="small muted" style="margin-top:0">Фото и видео с занятий, турниров и мероприятий, где вы отмечены.</p>' : ''}
      ${mdGrid(r.items, role() === 'client' ? 'Пока нет фото и видео с вами' : 'Добавьте первые фото и видео с занятий и турниров')}
      ${r.total > r.items.length ? `<div class="small muted" style="margin-top:8px">Показаны последние ${r.items.length} из ${r.total} — уточните фильтр</div>` : ''}`;
    $$('[data-mt]').forEach(c => c.onclick = () => { ui.type = c.dataset.mt; TLV.media(); });
    if ($('#mdfs')) $('#mdfs').onchange = e => { ui.festId = e.target.value; TLV.media(); };
    if ($('#mdcs')) $('#mdcs').onchange = e => { ui.clientId = e.target.value; TLV.media(); };
    if ($('#mdadd')) $('#mdadd').onclick = () => mdForm({festId: ui.festId, clientIds: ui.clientId ? [ui.clientId] : []}, null, TLV.media);
    mdWire($('#tlb'), r.items, TLV.media);
  }).catch(fail);
};
(function () {
  const baseFV = festView;
  festView = f => {
    baseFV(f);
    const box = document.createElement('div'); box.className = 'sect';
    $('#tlb').appendChild(box);
    const regs = S.C.regs.filter(g => g.festId === f.id && g.status !== 'cancelled').map(g => g.clientId);
    mdSection(box, {festId: f.id}, {festId: f.id, date: f.date, clientIds: regs}, 'Фото и видео с мероприятия');
  };
  const basePass2 = TLV.passport;
  TLV.passport = () => {
    basePass2();
    const cid = (S.ui.tlpp || {}).c;
    if (!cid || !$('#tlb')) return;
    const box = document.createElement('div'); box.className = 'card sect';
    $('#tlb').appendChild(box);
    mdSection(box, {clientId: cid}, {clientIds: [cid]}, 'Фото и видео ученика');
  };
})();
</script>
