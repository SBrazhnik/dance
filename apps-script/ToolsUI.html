<style>
.tl-tabs{margin-bottom:14px}
.tl-pick{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.tl-pick>div{min-width:220px;flex:1;max-width:420px}
.tl-score{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.tl-score i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--navy3));border-radius:6px}
.tl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tl-tag{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--okbg);color:var(--ok)}
.tl-tag.w{background:var(--soft);color:var(--muted)}
.tl-lv{display:flex;gap:4px;margin-top:6px}
.tl-lv i{flex:1;height:8px;border-radius:4px;background:var(--soft)}
.tl-lv i.on{background:var(--gold)}
.tl-dance{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tl-dance .card{padding:12px 14px}
.tl-rank{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--soft);color:var(--navy);flex:none}
.tl-rank.r1{background:#f3d77d;color:#6b4f00}.tl-rank.r2{background:#dfe3ea;color:#3a4252}.tl-rank.r3{background:#ecc29a;color:#6a3f15}
.tl-lg{display:flex;flex-direction:column;gap:8px}
.tl-lg .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tl-pts{font-size:20px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.tl-diary{border-left:3px solid var(--gold);padding:6px 0 6px 12px;margin:10px 0}
.tl-step{counter-reset:s;padding-left:0;list-style:none;margin:8px 0}
.tl-step li{counter-increment:s;position:relative;padding-left:30px;margin:8px 0}
.tl-step li:before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tl-link{word-break:break-all;background:var(--soft);padding:10px 12px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tl-sw{display:flex;align-items:center;gap:8px;cursor:pointer}
.tl-qr{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.tl-qrbox{width:200px;max-width:100%;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
</style>
<script>
I.spark = '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>';
I.send = '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>';
(function () {
  const i = PAGES.findIndex(p => p.k === 'help');
  PAGES.splice(i < 0 ? PAGES.length : i, 0, {k: 'tools', t: 'Инструменты', i: 'spark', r: ['admin']});
})();

const TL = {
  tabs() {
    const r = role();
    if (r === 'client') return [['my', 'Мой прогресс'], ['league', 'Лига'], ['tg', 'Telegram']];
    if (r === 'trainer') return [['pair', 'Подбор пары'], ['passport', 'Паспорт танцора'], ['league', 'Лига'], ['tg', 'Telegram']];
    return [['bot', 'Telegram-бот'], ['pair', 'Подбор пары'], ['passport', 'Паспорт танцора'], ['league', 'Корпоративная лига'], ['hr', 'Отчёт для HR']];
  },
  async load(force) {
    if (S.T && !force) return S.T;
    S.T = await call('toolsLoad', {}, true);
    return S.T;
  },
  clients() { return (S.D.clients || []).filter(c => c.active !== false).slice().sort((a, b) => a.name.localeCompare(b.name)); },
  levelName(n) { return (S.T.levels || [])[+n] || '—'; },
  levelBar(n) { return `<div class="tl-lv">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= n ? 'on' : ''}"></i>`).join('')}</div>`; },
  current(clientId) {
    const cur = {};
    (S.T.progress || []).filter(p => p.clientId === clientId).sort((a, b) => (a.date + a.createdAt).localeCompare(b.date + b.createdAt)).forEach(p => { cur[p.dance] = p; });
    return cur;
  },
  dancer(clientId) { return (S.T.dancers || []).find(d => d.clientId === clientId) || {}; },
  wireChips(root) { $$('.chips input[type=checkbox]', root).forEach(c => c.onchange = () => c.parentNode.classList.toggle('on', c.checked)); },
};

VIEWS.tools = tab => {
  const tabs = TL.tabs();
  const cur = tabs.find(t => t[0] === tab) ? tab : tabs[0][0];
  $('#main').innerHTML = `<div class="head"><h1>Инструменты</h1></div>
    <div class="tabs tl-tabs">${tabs.map(t => `<a data-tt="${t[0]}" class="${t[0] === cur ? 'on' : ''}">${t[1]}</a>`).join('')}</div>
    <div id="tlb">${empty('Загрузка…')}</div>`;
  $$('[data-tt]').forEach(a => a.onclick = () => go('tools', a.dataset.tt));
  const my = S.pageSeq;
  TL.load().then(() => { if (S.pageSeq !== my || !$('#tlb')) return; TLV[cur](); }).catch(fail);
};
async function tlRefresh() { await TL.load(true); if (S.route[0] === 'tools' && $('#tlb')) TLV[S.route[1] || TL.tabs()[0][0]](); }

function dancerForm(clientId, after) {
  const d = TL.dancer(clientId);
  const c = S.m.clients[clientId] || {};
  const bg = modal('Анкета: ' + esc(c.name || ''), `<div class="fg">
    ${fld('Рост, см', inp('height', +d.height || '', 'type="number" min="120" max="220"'))}
    ${fld('Уровень', sel('level', S.T.levels.map((n, i) => [i, n]), +d.level || 0))}
    ${fld('Пол', `<div class="small" style="padding-top:8px">${c.gender === 'М' ? 'мужской' : c.gender === 'Ж' ? 'женский' : '<span class="muted">не указан — заполните в карточке ученика</span>'}</div>`)}
    ${fld('Программы', chipsMulti('programs', dictList('program').map(p => p.name), progs(d.programs), 'Программы задаются в настройках'), 'full')}
    ${fld('Удобные дни', chipsMulti('days', S.T.days, progs(d.days)), 'full')}
    <div class="full">${chk('seek', 'Ищет партнёра / партнёршу', d.seek)}</div>
    ${fld('Заметка', inp('note', d.note || '', 'placeholder="Например: хочет готовиться к турниру весной"'), 'full')}
  </div>`, [{t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
    const v = vals(m); v.clientId = clientId;
    await call('saveDancer', v); toast('Анкета сохранена'); await TL.load(true); if (after) after();
  }}], {wide: true});
  TL.wireChips(bg);
}

const TLV = {};

TLV.pair = () => {
  const ui = S.ui.tlp || (S.ui.tlp = {c: ''});
  const seekers = (S.T.dancers || []).filter(d => d.seek && S.m.clients[d.clientId]);
  $('#tlb').innerHTML = `<p class="small muted" style="margin-top:0">Выберите ученика — система предложит партнёров по полу, росту (партнёр выше на 5–20 см), программе, уровню и удобным дням, а также подходящих тренеров. Чем полнее анкеты, тем точнее подбор.</p>
    <div class="tl-pick"><div>${fld('Ученик', sel('tlc', [['', '— выберите —']].concat(TL.clients().map(c => [c.id, c.name + (TL.dancer(c.id).seek ? ' · ищет пару' : '')])), ui.c, 'id="tlc"'))}</div>
      <button class="btn" id="tld" ${ui.c ? '' : 'disabled'}>${ic('edit')}Анкета</button></div>
    <div id="tlm">${ui.c ? empty('Подбираю…') : `<div class="card">${seekers.length ? `<h2 style="margin-top:0">Ищут пару</h2><div class="tl-tags">${seekers.map(d => `<span class="chip" data-pick="${d.clientId}">${esc(S.m.clients[d.clientId].name)}</span>`).join('')}</div>` : empty('Выберите ученика. Отметьте в анкетах тех, кто ищет пару, — они появятся здесь.')}</div>`}</div>`;
  $('#tlc').onchange = e => { ui.c = e.target.value; TLV.pair(); };
  $$('[data-pick]').forEach(x => x.onclick = () => { ui.c = x.dataset.pick; TLV.pair(); });
  if ($('#tld')) $('#tld').onclick = () => dancerForm(ui.c, TLV.pair);
  if (!ui.c) return;
  const my = S.pageSeq;
  call('toolsMatch', {clientId: ui.c}, true).then(r => {
    if (S.pageSeq !== my || !$('#tlm')) return;
    const d = r.me.dancer || {};
    const filled = (+d.height ? 1 : 0) + (progs(d.programs).length ? 1 : 0) + (+d.level ? 1 : 0) + (progs(d.days).length ? 1 : 0) + (r.me.gender ? 1 : 0);
    const max = Math.max(1, ...r.pairs.map(p => p.score));
    const card = p => `<div class="card tight"><div class="row"><div class="avatar c" style="width:36px;height:36px;font-size:13px">${initials(p.name)}</div>
        <div class="grow"><b>${esc(p.name)}</b><div class="small muted">${[p.company, p.height ? p.height + ' см' : '', p.level ? TL.levelName(p.level) : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
        ${p.seek ? '<span class="badge gold">ищет пару</span>' : ''}</div>
      <div class="tl-score"><i style="width:${Math.round(p.score / max * 100)}%"></i></div>
      <div class="tl-tags">${p.reasons.map(x => `<span class="tl-tag">${esc(x)}</span>`).join('')}${p.warn.map(x => `<span class="tl-tag w">${esc(x)}</span>`).join('')}</div></div>`;
    $('#tlm').innerHTML = `${filled < 4 ? `<div class="card tight" style="background:var(--gold2);border-color:transparent;margin-bottom:12px">Анкета заполнена на ${filled} из 5: ${[!r.me.gender && 'пол', !+d.height && 'рост', !progs(d.programs).length && 'программы', !+d.level && 'уровень', !progs(d.days).length && 'дни'].filter(Boolean).join(', ')}. Заполните — подбор станет точнее. <button class="btn sm" id="tld2">Заполнить</button></div>` : ''}
      <h2>Кандидаты в пару</h2>
      ${r.pairs.length ? `<div class="grid">${r.pairs.map(card).join('')}</div>` : `<div class="card">${empty('Подходящих кандидатов нет. Проверьте, что у учеников указан пол.')}</div>`}
      <h2 class="sect">Подходящие тренеры</h2>
      <div class="grid">${r.trainers.map(t => `<div class="card tight"><div class="row"><div class="avatar" style="width:36px;height:36px;font-size:13px">${initials(t.name)}</div>
        <div class="grow"><b>${esc(t.name)}</b><div class="small muted">${[t.height ? t.height + ' см' : '', t.programs].filter(Boolean).map(esc).join(' · ')}</div></div></div>
        <div class="tl-tags">${t.reasons.map(x => `<span class="tl-tag ${/учеников/.test(x) ? 'w' : ''}">${esc(x)}</span>`).join('')}</div></div>`).join('')}</div>`;
    if ($('#tld2')) $('#tld2').onclick = () => dancerForm(ui.c, TLV.pair);
  }).catch(fail);
};

function passportHtml(clientId, opts) {
  opts = opts || {};
  const cur = TL.current(clientId);
  const dances = S.T.dances.concat(Object.keys(cur).filter(k => !S.T.dances.includes(k)));
  const hist = (S.T.progress || []).filter(p => p.clientId === clientId).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  const diary = (S.T.diary || []).filter(p => p.clientId === clientId).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  const done = Object.keys(cur).length;
  const avg = done ? Object.values(cur).reduce((a, p) => a + (+p.level || 0), 0) / done : 0;
  return `<div class="kpis" style="margin-bottom:14px"><div class="kpi"><b>${done}</b><span>танцев в работе</span></div>
      <div class="kpi"><b>${avg ? fh(Math.round(avg * 10) / 10) : '—'}</b><span>средний уровень из 5</span></div>
      <div class="kpi"><b>${hist.length}</b><span>отметок прогресса</span></div><div class="kpi"><b>${diary.length}</b><span>записей в дневнике</span></div></div>
    <div class="row"><h2 class="grow" style="margin:0">Уровни по танцам</h2>${opts.edit ? `<button class="btn sm pri" id="tlpl">${ic('plus')}Отметить уровень</button>` : ''}</div>
    <div class="tl-dance" style="margin-top:10px">${dances.map(dn => { const p = cur[dn]; return `<div class="card ${opts.edit ? 'click' : ''}" ${opts.edit ? `data-dn="${esc(dn)}"` : ''} style="${p ? '' : 'opacity:.6'}">
      <div class="row"><b class="grow">${esc(dn)}</b><span class="small ${p ? '' : 'muted'}">${p ? esc(TL.levelName(p.level)) : 'не начат'}</span></div>
      ${TL.levelBar(p ? +p.level : 0)}${p ? `<div class="small muted" style="margin-top:6px">${fd(p.date)}${p.note ? ' · ' + esc(p.note) : ''}</div>` : ''}</div>`; }).join('')}</div>
    <div class="row sect"><h2 class="grow" style="margin:0">Дневник занятий</h2>${opts.edit ? `<button class="btn sm pri" id="tlpd">${ic('plus')}Запись</button>` : ''}</div>
    <div class="card" style="margin-top:10px">${diary.length ? diary.slice(0, 40).map(x => `<div class="tl-diary ${opts.edit ? 'click' : ''}" ${opts.edit ? `data-di="${x.id}"` : ''}>
      <div class="small muted">${fd(x.date)} · ${esc(x.trainerName || x.createdBy)}</div><div>${esc(x.text)}</div>
      ${x.video ? `<a href="${esc(x.video)}" target="_blank" rel="noopener" class="small">▶ Видео с занятия</a>` : ''}</div>`).join('') : empty(opts.edit ? 'После занятия запишите одной строкой, что отработали и над чем работать дальше.' : 'Тренер ещё не делал записей')}</div>
    ${hist.length ? `<h2 class="sect">История уровней</h2><div class="tw"><table class="t"><thead><tr><th>Дата</th><th>Танец</th><th>Уровень</th><th>Кто отметил</th><th>Заметка</th>${opts.del ? '<th></th>' : ''}</tr></thead><tbody>
      ${hist.map(h => `<tr><td class="nowrap">${fd(h.date)}</td><td>${esc(h.dance)}</td><td>${esc(TL.levelName(h.level))}</td><td>${esc(h.trainerName)}</td><td>${esc(h.note)}</td>${opts.del ? `<td><button class="btn sm" data-pdel="${h.id}">${ic('trash')}</button></td>` : ''}</tr>`).join('')}
    </tbody></table></div>` : ''}`;
}
function progressForm(clientId, dance) {
  const cur = TL.current(clientId)[dance];
  modal('Уровень: ' + esc((S.m.clients[clientId] || {}).name || ''), `<div class="fg">
    ${fld('Танец', sel('dance', S.T.dances.map(x => [x, x]), dance || S.T.dances[0]), 'full')}
    ${fld('Уровень', sel('level', S.T.levels.slice(1).map((n, i) => [i + 1, n]), cur ? Math.min(5, +cur.level + 1) : 1))}
    ${fld('Дата', inp('date', today(), 'type="date"'))}
    ${fld('Заметка', inp('note', '', 'placeholder="Например: уверенно держит раму"'), 'full')}
  </div>`, [{t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
    const v = vals(m); v.clientId = clientId; await call('saveProgress', v); toast('Уровень отмечен'); await tlRefresh();
  }}]);
}
function diaryForm(clientId, o) {
  o = o || {};
  modal(o.id ? 'Запись в дневнике' : 'Новая запись в дневнике', `<div class="fg">
    ${fld('Дата', inp('date', o.date || today(), 'type="date"'))}
    ${fld('Что отработали, над чем работать', txt('text', o.text), 'full')}
    ${fld('Ссылка на видео (Google Диск, YouTube…)', inp('video', o.video || '', 'placeholder="https:' + '/' + '/…"'), 'full')}
  </div>`, [o.id ? {t: ic('trash') + 'Удалить', cls: 'danger', left: 1, fn: async () => { await call('deleteDiary', {id: o.id}); toast('Удалено'); await tlRefresh(); }} : null,
    {t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
      const v = vals(m); v.clientId = clientId; v.id = o.id; await call('saveDiary', v); toast('Запись сохранена'); await tlRefresh();
    }}].filter(Boolean));
}
function printPassport(clientId) {
  const c = S.m.clients[clientId] || {};
  const cur = TL.current(clientId);
  const diary = (S.T.diary || []).filter(p => p.clientId === clientId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  showDoc('Паспорт танцора — ' + c.name, `<h1>Паспорт танцора</h1><div><b>${esc(c.name)}</b>${c.company ? ' · ' + esc(c.company) : ''}</div>
    <h2>Уровни по танцам</h2><table><thead><tr><th>Танец</th><th>Уровень</th><th>С какого числа</th></tr></thead><tbody>
    ${Object.keys(cur).map(k => `<tr><td>${esc(k)}</td><td>${esc(TL.levelName(cur[k].level))} (${cur[k].level} из 5)</td><td>${fd(cur[k].date)}</td></tr>`).join('') || '<tr><td colspan="3">Пока нет отметок</td></tr>'}</tbody></table>
    ${diary.length ? `<h2>Дневник</h2><table><thead><tr><th>Дата</th><th>Тренер</th><th>Что отработали</th></tr></thead><tbody>${diary.map(x => `<tr><td class="nowrap">${fd(x.date)}</td><td>${esc(x.trainerName || x.createdBy)}</td><td>${esc(x.text)}</td></tr>`).join('')}</tbody></table>` : ''}`);
}
TLV.passport = () => {
  const ui = S.ui.tlpp || (S.ui.tlpp = {c: ''});
  $('#tlb').innerHTML = `<div class="tl-pick"><div>${fld('Ученик', sel('tlc', [['', '— выберите —']].concat(TL.clients().map(c => [c.id, c.name])), ui.c, 'id="tlc"'))}</div>
    ${ui.c ? `<button class="btn" id="tlpp">${ic('print')}Печать</button>` : ''}</div><div id="tlpv">${ui.c ? passportHtml(ui.c, {edit: true, del: role() !== 'trainer'}) : `<div class="card">${empty('Выберите ученика, чтобы увидеть и отметить его прогресс по танцам')}</div>`}</div>`;
  $('#tlc').onchange = e => { ui.c = e.target.value; TLV.passport(); };
  if (!ui.c) return;
  $('#tlpp').onclick = () => printPassport(ui.c);
  $('#tlpl').onclick = () => progressForm(ui.c);
  $('#tlpd').onclick = () => diaryForm(ui.c);
  $$('[data-dn]').forEach(x => x.onclick = () => progressForm(ui.c, x.dataset.dn));
  $$('[data-di]').forEach(x => x.onclick = () => diaryForm(ui.c, S.T.diary.find(d => d.id === x.dataset.di)));
  $$('[data-pdel]').forEach(b => b.onclick = async e => { e.stopPropagation(); try { await call('deleteProgress', {id: b.dataset.pdel}); toast('Удалено'); await tlRefresh(); } catch (er) { fail(er); } });
};
TLV.my = () => {
  const cid = S.user.clientId;
  const d = TL.dancer(cid);
  $('#tlb').innerHTML = `<div class="card tight row" style="margin-bottom:14px"><div class="grow"><b>Ищу пару</b><div class="small muted">Отметьте, и тренеры предложат вам партнёра по росту, уровню и расписанию.</div></div>
      <label class="tl-sw"><input type="checkbox" id="tlseek" ${d.seek ? 'checked' : ''}> ${d.seek ? 'ищу' : 'не ищу'}</label><button class="btn sm" id="tlan">${ic('edit')}Анкета</button></div>
    ${passportHtml(cid, {})}`;
  $('#tlseek').onchange = async e => {
    try { await call('saveDancer', Object.assign({}, d, {clientId: cid, seek: e.target.checked, programs: progs(d.programs), days: progs(d.days)})); await tlRefresh(); toast(e.target.checked ? 'Тренеры увидят, что вы ищете пару' : 'Сохранено'); } catch (er) { fail(er); }
  };
  $('#tlan').onclick = () => dancerForm(cid, tlRefresh);
};

TLV.league = () => {
  const staff = ['admin', 'manager'].includes(role());
  const my = S.pageSeq;
  $('#tlb').innerHTML = empty('Считаю баллы…');
  call('leagueTable', {}, true).then(r => {
    if (S.pageSeq !== my || !$('#tlb')) return;
    const max = Math.max(1, ...r.companies.map(c => c.points));
    const rk = i => `<span class="tl-rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</span>`;
    const awards = (S.T.awards || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    $('#tlb').innerHTML = `<div class="row" style="margin-bottom:6px"><div class="grow"><h2 style="margin:0">${esc(r.name)}</h2>
        <div class="small muted">Сезон ${fd(r.from)} — ${fd(r.to)} · баллы: ${r.rules.pH} за час занятий, ${r.rules.pE} за турнир, ${r.rules.pL} за новый уровень, плюс награды</div></div>
        ${staff ? `<button class="btn" id="tlaw">${ic('plus')}Баллы</button><button class="btn" id="tlrules">${ic('cog')}Правила</button><button class="btn" id="tllp">${ic('print')}Печать</button>` : ''}</div>

function tlQrLib() {
  if (window.qrcode) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    sc.onload = () => res(); sc.onerror = () => rej(new Error('Не удалось загрузить генератор QR-кода — проверьте интернет'));
    document.head.appendChild(sc);
  });
}
async function tlQr(text, cell) {
  await tlQrLib();
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), pad = 4, size = (n + pad * 2) * cell;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#1a2643';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + pad) * cell, (r + pad) * cell, cell, cell);
  c.style.width = '100%'; c.style.height = 'auto'; c.style.imageRendering = 'pixelated';
  return c;
}

          ${fld('«Мало часов» — это, ч', inp('bot_lowHours', s.bot_lowHours, 'type="number" min="0" step="0.5"'))}
          ${fld('«Давно не был» — дней', inp('bot_inactive', s.bot_inactive, 'type="number" min="3"'))}</div></div>
        ${admin ? `<div class="row" style="margin-top:12px"><button class="btn pri" id="tlbsave">Сохранить</button>${b.connected ? `<button class="btn" id="tlbrun">${ic('send')}Отправить сейчас</button><span class="spacer"></span><button class="btn danger sm" id="tlboff">Отключить бота</button>` : ''}</div>` : ''}</div>
    </div>
    ${b.connected && b.link ? `<div class="card sect"><div class="tl-qr">
      <div class="tl-qrbox" id="tlqr">${empty('QR-код…')}</div>
      <div class="grow" style="min-width:0"><h2 style="margin-top:0">Подключение для всех</h2>
        <p style="margin:6px 0">Одна ссылка для всех учеников и тренеров. Человек открывает её или наводит камеру на QR-код, нажимает «Запустить» и «📱 Поделиться номером» — бот сам найдёт его по номеру телефона из карточки. Тренеров с указанным @ником в карточке бот узнаёт сразу.</p>
        <div class="tl-link" id="tlgl">${esc(b.link)}</div>
        <div class="row" style="margin-top:10px"><button class="btn pri" id="tlqrs">${ic('dl')}Скачать QR-код</button><button class="btn" id="tlqrp">${ic('print')}Плакат для зала</button><button class="btn" id="tlqrc">Скопировать ссылку</button></div>
      </div></div></div>` : ''}
    ${pend.length ? `<div class="card sect" style="border-color:var(--gold)"><h2 style="margin-top:0">Ждут подтверждения · ${pend.length}</h2>
      <p class="small muted" style="margin-top:-4px">Эти люди поделились номером, но бот не нашёл его в карточках (или номер есть у нескольких человек). Выберите, кто это, и нажмите «Подключить».</p>
      <div class="tw"><table class="t"><thead><tr><th>Telegram</th><th>Номер</th><th>Кто это</th><th></th></tr></thead><tbody>
      ${pend.map(r => `<tr><td><b>${esc(r.name)}</b><div class="small muted">${esc(String(r.linkedAt || '').slice(0, 16))}</div></td><td class="nowrap">${esc(r.phone)}</td>
        <td style="min-width:220px">${sel('pa_' + r.id, [['', '— выберите —']].concat(TL.clients().map(c => ['client|' + c.id, c.name + ' · ученик']), (S.D.trainers || []).filter(t => t.active).map(t => ['trainer|' + t.id, t.name + ' · тренер']), (S.D.users || []).filter(u => u.active && ['admin', 'manager'].includes(u.role)).map(u => ['user|' + u.id, u.name + ' · сотрудник'])), '', 'data-pa="' + r.id + '"')}</td>
        <td class="nowrap"><button class="btn sm pri" data-pok="${r.id}">Подключить</button> <button class="btn sm" data-pno="${r.id}">${ic('trash')}</button></td></tr>`).join('')}
      </tbody></table></div></div>` : ''}
    <div class="card sect"><div class="row"><div class="grow"><h2 style="margin:0">Рассылка</h2>
      <div class="small muted">Свободное сообщение: важные новости, мероприятия, изменения расписания, технические работы.</div></div>
      <button class="btn pri" id="tlbcn" ${b.connected ? '' : 'disabled title="Сначала подключите бота"'}>${ic('send')}Новая рассылка</button></div>
      <div id="tlbch" style="margin-top:12px">${empty('Загрузка…')}</div></div>
    <h2 class="sect">Кому отправлять</h2>
    <p class="small muted" style="margin-top:-4px">Нажмите «Ссылка» и отправьте её человеку — после подключения ему будут приходить уведомления. Снимите галку, чтобы не отправлять конкретному человеку.</p>
    <div class="row" style="margin-bottom:10px"><div class="chips">${[['client', 'Ученики', cnt('client')], ['trainer', 'Тренеры', cnt('trainer')], ['user', 'Сотрудники', cnt('user')]].map(x => `<span class="chip ${ui.k === x[0] ? 'on' : ''}" data-tk="${x[0]}">${x[1]} · ${x[2]}</span>`).join('')}</div>
      <span class="spacer"></span><input class="inp" id="tlq" placeholder="Поиск…" value="${esc(ui.q)}" style="max-width:240px"></div>
    <div class="tw"><table class="t"><thead><tr><th>Имя</th><th>Статус</th><th>Уведомления</th><th></th></tr></thead><tbody>
    ${list.map(p => { const r = rowOf(p.k, p.id); return `<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.sub)}</div></td>
      <td>${r && r.linked ? '<span class="badge ok">подключён</span>' : r ? '<span class="badge">ссылка выдана</span>' : '<span class="small muted">—</span>'}</td>
      <td>${r ? `<label class="tl-sw"><input type="checkbox" data-nt="${r.id}" ${r.notify ? 'checked' : ''}> отправлять</label>` : '<span class="small muted">после подключения</span>'}</td>
      <td class="nowrap"><button class="btn sm" data-lk="${p.k}|${p.id}">${ic('send')}Ссылка</button>${r && r.linked ? ` <button class="btn sm" data-tt2="${r.id}">Проверка</button> <button class="btn sm" data-ul="${r.id}">Отключить</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="4">${empty('Никого не найдено')}</td></tr>`}
    </tbody></table></div>`;
  $('#tlbcn').onclick = () => broadcastForm();
  if ($('#tlqr')) {
    tlQr(b.link, 8).then(c => { const box = $('#tlqr'); if (box) { box.innerHTML = ''; box.appendChild(c); } }).catch(e => { const box = $('#tlqr'); if (box) box.innerHTML = '<div class="small muted">' + esc(e.message) + '</div>'; });
    $('#tlqrs').onclick = async () => { try { const c = await tlQr(b.link, 16); c.toBlob(bl => saveBlob('QR-бот-клуба.png', bl), 'image/png'); } catch (e) { fail(e); } };
    $('#tlqrp').onclick = async () => { try { const c = await tlQr(b.link, 12); showDoc('Плакат: подключение к боту', `<div style="text-align:center;padding:20px 10px">
      <h1 style="font-size:30px;margin:10px 0">Уведомления клуба в Telegram</h1>
      <p style="font-size:17px;margin:6px 0 18px">Напоминания о занятиях, остаток часов и новости клуба</p>
      <div><img src="${c.toDataURL('image/png')}" style="width:300px;height:300px;image-rendering:pixelated"></div>
      <ol style="text-align:left;display:inline-block;font-size:17px;line-height:1.7;margin-top:18px"><li>Наведите камеру телефона на QR-код</li><li>Нажмите «Запустить» в Telegram</li><li>Нажмите «📱 Поделиться номером»</li></ol>
      <p style="font-size:15px;color:#555">или откройте ссылку: <b>${esc(b.link)}</b></p></div>`); } catch (e) { fail(e); } };
    $('#tlqrc').onclick = async () => { try { await navigator.clipboard.writeText(b.link); toast('Ссылка скопирована'); } catch (e) { const sl = getSelection(), rg = document.createRange(); rg.selectNodeContents($('#tlgl')); sl.removeAllRanges(); sl.addRange(rg); toast('Выделено — скопируйте вручную'); } };
  }
  $$('[data-pok]').forEach(x => x.onclick = async () => {
    const v = ($('[data-pa="' + x.dataset.pok + '"]') || {}).value || '';
    if (!v) return toast('Выберите, кто это', true);
    const [kind, refId] = v.split('|');
    try { await call('tgAssign', {id: x.dataset.pok, kind, refId}); toast('Подключено — бот отправил приветствие'); await tlRefresh(); } catch (e) { fail(e); }
  });
  $$('[data-pno]').forEach(x => x.onclick = async () => { try { await call('tgReject', {id: x.dataset.pno}); toast('Заявка удалена'); await tlRefresh(); } catch (e) { fail(e); } });
  bcHistory();
  $$('[data-tk]').forEach(c => c.onclick = () => { ui.k = c.dataset.tk; TLV.bot(); });
  $('#tlq').oninput = e => { ui.q = e.target.value; clearTimeout(TL.qt); TL.qt = setTimeout(() => { TLV.bot(); const q = $('#tlq'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); };
  $$('[data-nt]').forEach(c => c.onchange = async () => { try { await call('tgSetNotify', {id: c.dataset.nt, notify: c.checked}, true); const r = rows.find(x => x.id === c.dataset.nt); if (r) r.notify = c.checked; toast(c.checked ? 'Уведомления включены' : 'Уведомления выключены'); } catch (e) { c.checked = !c.checked; fail(e); } });
  $$('[data-lk]').forEach(x => x.onclick = () => { const [k, id] = x.dataset.lk.split('|'); tgLinkModal({kind: k, refId: id}); });
  $$('[data-tt2]').forEach(x => x.onclick = async () => { try { await call('tgTest', {id: x.dataset.tt2}); toast('Проверочное сообщение отправлено'); } catch (e) { fail(e); } });
  $$('[data-ul]').forEach(x => x.onclick = async () => { try { await call('tgUnlink', {id: x.dataset.ul}); toast('Отключено. Новая ссылка понадобится для повторного подключения'); await tlRefresh(); } catch (e) { fail(e); } });
  if ($('#tlbsave')) $('#tlbsave').onclick = async () => {
    const v = vals($('#tlbs')); v.token = $('#tltok') ? $('#tltok').value.trim() : '';
    ['bot_remind', 'bot_low', 'bot_digest', 'bot_nudge'].forEach(k => { v[k] = v[k] ? 'true' : 'false'; });
    try { await call('botSave', v); toast(v.token ? 'Бот подключён' : 'Настройки сохранены'); await tlRefresh(); } catch (e) { fail(e); }
  };
  if ($('#tlbrun')) $('#tlbrun').onclick = async () => { try { const r = await call('botRunNow', {}); toast('Отправлено сообщений: ' + r.sent); await tlRefresh(); } catch (e) { fail(e); } };
  if ($('#tlboff')) $('#tlboff').onclick = () => modal('Отключить бота?', '<p style="margin-top:0">Бот перестанет отвечать и присылать уведомления. Подключения людей сохранятся — после нового подключения всё заработает снова.</p>',
    [{t: 'Отмена'}, {t: 'Отключить', cls: 'danger', fn: async () => { await call('botDisconnect', {}); toast('Бот отключён'); await tlRefresh(); }}]);
};
</script>
