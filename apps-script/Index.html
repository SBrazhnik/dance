h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .nowrap{white-space:nowrap} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .spacer{flex:1}
.stack>*+*{margin-top:12px}

/* шапка и меню */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:58px;padding:0 14px;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top img{width:40px;height:40px;border-radius:8px}
.top .ttl{font-weight:650;font-size:15px;line-height:1.15}
.top .ttl small{display:block;font-weight:400;opacity:.7;font-size:12px}
.burger,.ibtn{background:none;border:0;color:inherit;padding:8px;border-radius:8px;cursor:pointer;display:flex}
.tlinks{display:flex;gap:6px;margin-right:4px}
.tlink{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.tlink:hover{background:rgba(255,255,255,.12)}
.llinks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.llink{text-decoration:none;color:#fff!important;background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.3)!important}
@media (max-width:640px){.tlink span{display:none}.tlink{padding:7px;border-color:transparent}.tlinks{gap:0;margin-right:0}}
.burger:hover,.ibtn:hover{background:rgba(255,255,255,.12)}
.layout{display:flex;min-height:calc(100vh - 58px)}
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--text);text-decoration:none;cursor:pointer;font-size:14.5px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--navy);color:#fff}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
main{flex:1;min-width:0;padding:20px;max-width:1180px}
.scrim{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;height:100%;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:16px}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,15,30,.4);z-index:30}
  main{padding:14px 12px 80px}
  .top{gap:8px;padding:0 8px}
  .top img{width:34px;height:34px}
  .top .ttl{font-size:13px;line-height:1.2}
  .top .ttl small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
  .kpi b{font-size:22px}
  h1{font-size:20px}
}
@media (min-width:901px){.burger{display:none}}

/* карточки */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card.tight{padding:12px 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:650;color:var(--navy);letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h1{flex:1;min-width:180px}
.sect{margin-top:22px}
.sect>h2{margin-bottom:10px}
.click{cursor:pointer;transition:border-color .15s}
.click:hover{border-color:#b9c2d8}

/* кнопки, поля */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #d6dbe6;background:#fff;border-radius:9px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(50,70,122,.15)}
textarea.inp{min-height:70px;resize:vertical}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.fg .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search{position:relative;min-width:200px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}

/* бейджи и прогресс */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--navy3)}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.warn{background:var(--warnbg);color:var(--warn)} .badge.bad{background:var(--badbg);color:var(--bad)} .badge.gold{background:var(--gold2);color:#8a6a1e}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy3);border-radius:8px}
.bar.low i{background:var(--warn)} .bar.ended i,.bar.expired i{background:var(--bad)}
.sub{padding:10px 0;border-top:1px solid var(--line)}
.sub:first-child{border-top:0;padding-top:0}
.left-ok{border-left:4px solid var(--ok)} .left-warn{border-left:4px solid var(--warn)} .left-bad{border-left:4px solid var(--bad)} .left-none{border-left:4px solid #c9cfdb}

/* таблицы */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);background:#f8f9fc;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:650;background:#f8f9fc}
.t td.n,.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t tr.click:hover td{background:#fafbfe}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* модалки, тосты */
.modal-bg{position:fixed;inset:0;background:rgba(12,18,35,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease-out}
.modal.wide{max-width:760px}
.modal.xl{max-width:1000px}
iframe.docv{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-items:end}
.filters .pair{display:flex;gap:6px;align-items:center}
.filters .pair .inp{min-width:0}
.filters .search{min-width:0}
.filters .search .inp{width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.swatch{width:42px;height:38px;padding:2px;border:1px solid #d6dbe6;border-radius:9px;background:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modal .mh{display:flex;align-items:center;padding:16px 18px 6px}
.modal .mh h2{flex:1}
.modal .mb{padding:10px 18px 4px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 18px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@media (max-width:600px){.modal-bg{padding:0;align-items:flex-end}.modal{border-radius:16px 16px 0 0;max-height:94vh;overflow:auto}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:11px 18px;border-radius:10px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw;font-size:14px}
.toast.err{background:var(--bad)}
.loading{position:fixed;top:58px;left:0;right:0;height:3px;z-index:50;overflow:hidden}
.loading:after{content:"";display:block;height:100%;width:40%;background:var(--gold);animation:ld 1s infinite ease-in-out}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* мультивыбор */
.ms{border:1px solid #d6dbe6;border-radius:9px;background:#fff}
.ms .ms-s{border:0;border-bottom:1px solid var(--line);border-radius:9px 9px 0 0}
.ms .ms-l{max-height:220px;overflow:auto;padding:4px 6px}
.ms .ms-l label{display:flex;gap:8px;align-items:center;padding:6px 6px;border-radius:7px;cursor:pointer;font-size:14px}
.ms .ms-l label:hover{background:var(--soft)}
.ms .ms-c{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}

/* вход */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#3a4f86 0%,var(--navy) 45%,var(--navy2) 100%)}
.login .box{width:100%;max-width:380px;text-align:center;color:#fff}
.login img{width:132px;height:132px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.login h1{font-size:21px;margin:18px 0 4px;line-height:1.25}
.login p{opacity:.7;margin:0 0 22px;font-size:14px}
.login form{background:#fff;color:var(--text);border-radius:16px;padding:20px;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login .gold-line{width:56px;height:3px;background:var(--gold);border-radius:3px;margin:12px auto 0}

/* чат */
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:360px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;background:var(--soft);border-radius:12px 12px 12px 4px;padding:8px 12px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-radius:12px 12px 4px 12px}
.msg .who{font-size:12px;font-weight:600;opacity:.75;margin-bottom:2px}
.msg .when{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.msg .txt{white-space:pre-wrap;word-wrap:break-word}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

/* расписание */
.day{margin-top:16px}
.day h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.slot{display:flex;gap:12px;align-items:flex-start}
.slot .tm{font-weight:650;color:var(--navy);min-width:52px;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(80px,min(200px,38%)) 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px}
.hb .bar i{background:linear-gradient(90deg,var(--navy3),var(--navy))}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
#rf.spin svg{animation:rfspin 1s linear infinite}@keyframes rfspin{to{transform:rotate(360deg)}}
.tabs a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:38px;padding:7px 10px;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-weight:550;font-size:14px;line-height:1.2}
.tabs a:hover{border-color:var(--navy3)}
.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:600px){.tabs{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.tabs a{font-size:13px;padding:6px 8px;min-height:36px}}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;flex:none}
.avatar.c{background:var(--gold)}
.avatar.sm{width:30px;height:30px;font-size:11px}
.avatar.ph{background-size:cover;background-position:center;color:transparent}
.avatar.edit{cursor:pointer;position:relative}
.avatar.edit:after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px;background:var(--card);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25);color:initial}
.news-i{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 18px}
.news-i h3{margin:2px 0 6px;font-size:16px}
.news-i ul{margin:0;padding-left:18px}.news-i li{margin:4px 0;line-height:1.45}
.hgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.hgrid .wide{grid-column:1/-1}
.hgrid>.hw{min-width:0}
.hset{display:flex;flex-direction:column;gap:6px}
.hset-r{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.hset-r .ibtn{width:30px;height:30px}
@media (max-width:600px){.hide-sm{display:none}.hgrid{grid-template-columns:1fr}}
.menu{position:absolute;right:10px;top:54px;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);min-width:220px;padding:6px;z-index:70}
.menu a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu a:hover{background:var(--soft)}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
@media print{.top,.side,.btn,.tabs{display:none!important} main{padding:0}}
.help{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.hnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:70px}
.hnav a{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
.hnav a:hover{background:var(--soft)} .hnav a.on{background:var(--navy);color:#fff}
.hbody{min-width:0;line-height:1.55} .hbody h2{margin:0 0 10px} .hbody p{margin:10px 0;max-width:72ch}
.hs{margin:8px 0 12px;padding-left:22px} .hs li{margin:4px 0}
.hf{margin:14px 0 18px} .hf img{display:block;max-width:100%;max-height:560px;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(20,30,60,.08);cursor:zoom-in;background:var(--soft)}
.hf figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.hbody .note{background:var(--gold2);padding:8px 12px;border-radius:8px}
.rbtns{display:inline-flex;gap:2px;flex:none;align-self:center}.rbtns .ibtn{width:32px;height:32px;color:var(--muted)}.rbtns .ibtn:hover{color:var(--navy);background:var(--soft)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;z-index:90;max-width:calc(100% - 24px)}
@media (max-width:760px){.help{grid-template-columns:1fr}.hnav{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}.hnav a{display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:13px;min-height:36px}}

/* ===== Оформление клуба (как на сайте ano.dance). .brand — общее (шрифты, кнопки-кисти), .th-ano — тёмное, .th-lt — светлое ===== */
html.brand{--f-disp:'Foglihten','Cormorant Unicase',Georgia,serif; --f-script:'Eddy Mits','Marck Script',cursive; --r:16px; --sh:none}
html.th-ano{
  --navy:#3F3561; --navy2:#0B0F16; --navy3:#C9B8FF; --gold:#C9B8FF; --gold2:rgba(124,92,230,.16);
  --bg:#121721; --card:#1D222A; --text:#F1F2F5; --muted:#AAAEB6; --line:rgba(255,255,255,.08); --soft:#262C36;
  --ok:#5FD493; --okbg:rgba(95,212,147,.14); --warn:#F2BD55; --warnbg:rgba(242,189,85,.14); --bad:#FF8080; --badbg:rgba(255,128,128,.14);
  --field:#2B303A; color-scheme:dark; scrollbar-color:#3A4150 transparent;
}
html.th-lt{
  --navy:#121721; --navy2:#0B0F16; --navy3:#5B45C8; --gold:#7C5CE6; --gold2:rgba(124,92,230,.10);
  --bg:#F3F2F7; --card:#fff; --text:#121721; --muted:#5E6472; --line:#E3E1EA; --soft:#EEECF4;
  --field:#F6F5FA; color-scheme:light;
}
html.brand,html.brand body{font-family:'Golos Text',-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:where(.th-ano) a{color:#C9B8FF}
:where(.th-lt) a{color:#5B45C8}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:0}
.brand .script{font-family:var(--f-script);font-size:20px;color:var(--muted);margin:2px 0 0}
.brand .top{background:#0B0F16;box-shadow:none;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .top img,.brand .login img{content:url(https://corpdance.ru/brand/logo.svg);border-radius:0;box-shadow:none;object-fit:contain}
.brand .top .ttl{font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:.01em;line-height:1.05}
.brand .top .ttl small{font-family:'Golos Text',sans-serif;letter-spacing:0;margin-top:2px}
.brand .tlink{color:#fff}
.brand #um .avatar{background-color:#3F3561!important;color:#fff}
.brand #um .avatar.ph{color:transparent}
.brand .side{display:flex;flex-direction:column}
.brand .kpi b{font-family:var(--f-disp);font-weight:400;font-size:38px;line-height:1.05;letter-spacing:0}
.brand .modal .mh h2{font-family:var(--f-disp);font-weight:400;font-size:26px}
.brand .card,.brand .kpi{border-color:var(--line)}
.brand .chk input{accent-color:#7C5CE6}
.brand .inp:focus{border-color:#7C5CE6;box-shadow:0 0 0 3px rgba(124,92,230,.25)}
.brand .badge.gold{background:#7C5CE6;color:#fff}
.brand .bar{background:var(--field)}
.brand .news-i{border-left-color:#7C5CE6}
.brand .hbody .note{background:rgba(124,92,230,.12)}
.brand .avatar{background:#3F3561}
.brand .avatar.c{background:#7C5CE6}
.brand .updbar{background:#3F3561}
.brand .loading:after{background:#C9B8FF}
.brand .btn.pri{background:#3F3561;border-color:#3F3561;color:#fff}
.brand .btn.pri:hover{background:#4E4278}
.brand .btn.brush,.brand #qa,.brand #lf>button.btn.pri{background:url(https://corpdance.ru/brand/brush.webp) center/100% 100% no-repeat transparent;border:0;color:#121721;text-transform:uppercase;letter-spacing:.07em;font-weight:650;min-height:48px;padding:8px 34px}
.brand #qa{padding:8px 62px;letter-spacing:.05em;font-size:13.5px}
.brand #qa svg{display:none}
.brand .btn.brush:hover,.brand #qa:hover,.brand #lf>button.btn.pri:hover{background-color:transparent;filter:brightness(1.08)}
.brand .modal-bg{background:rgba(4,6,12,.62)}
.brand .modal{border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.4)}
.brand #hty .bar i,.brand .dot{filter:saturate(1.1)}
/* вход — всегда тёмный, как на сайте */
.brand .login{background:#121721;position:relative;overflow:hidden;color-scheme:dark}
.brand .login:before{content:"";position:absolute;left:50%;top:50%;width:min(720px,140vw);height:min(740px,144vw);transform:translate(-50%,-38%);background:url(https://corpdance.ru/brand/dancers.jpg) center/contain no-repeat;opacity:.38;pointer-events:none}
.brand .login .box{position:relative;max-width:400px}
.brand .login img{width:72px;height:72px}
.brand .login h1{font-size:38px;line-height:1;margin:16px 0 6px}
.brand .login .gold-line{display:none}
.brand .login p{font-family:var(--f-script);font-size:22px;opacity:.85}
.brand .login form{background:rgba(23,28,36,.88);border:1px solid rgba(255,255,255,.08);color:#F1F2F5;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand .login .inp{background:#2B303A;border-color:transparent;color:#F1F2F5}
.brand .login .muted{color:#AAAEB6}
.brand .login a{color:#C9B8FF}
.brand .llink{background:rgba(255,255,255,.06)!important}

/* тёмное */
.th-ano .side{background:#0E121A;border-right:1px solid var(--line)}
.th-ano .side:after{content:"";display:block;flex:none;margin:auto auto 0;width:180px;height:184px;background:url(https://corpdance.ru/brand/dancers.jpg) center/contain no-repeat;mix-blend-mode:lighten;opacity:.4}
.th-ano .nav a{color:#D6D8DD}
.th-ano .nav a:hover{background:rgba(255,255,255,.06)}
.th-ano .nav a.on{background:#fff;color:#121721}
.th-ano .kpi b{color:#fff}
.th-ano .click:hover{border-color:rgba(201,184,255,.45)}
.th-ano .btn{background:#262C36;border-color:rgba(255,255,255,.1)}
.th-ano .btn:hover{background:#2F3642}
.th-ano .btn.gold{background:#C9B8FF;border-color:#C9B8FF;color:#121721}
.th-ano .inp,.th-ano select.inp,.th-ano textarea.inp{background:var(--field);border-color:transparent;color:var(--text)}
.th-ano .inp::placeholder{color:#80858E}
.th-ano select.inp option{background:#1D222A;color:#F1F2F5}
.th-ano .chip.on,.th-ano .tabs a.on{background:#fff;color:#121721;border-color:#fff}
.th-ano .tabs a:hover,.th-ano .chip:hover{border-color:rgba(201,184,255,.5)}
.th-ano .badge{background:rgba(201,184,255,.14);color:#C9B8FF}
.th-ano .bar i{background:#C9B8FF}
.th-ano .hb .bar i{background:linear-gradient(90deg,#8E74EE,#C9B8FF)}
.th-ano #hty .bar i,.th-ano .dot,.th-ano .badge[style]{filter:brightness(1.8) saturate(1.1)}
.th-ano .left-none{border-left-color:#3A4150}
.th-ano .t th,.th-ano .t tfoot td{background:#171C24}
.th-ano .t tr.click:hover td{background:rgba(255,255,255,.03)}
.th-ano .modal-bg{background:rgba(4,6,12,.7)}
.th-ano .toast{background:#2B303A;border:1px solid var(--line)}
.th-ano .toast.err{background:#9E2F2F}
.th-ano .menu{background:#1D222A;color:var(--text);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.th-ano .ms,.th-ano .swatch{background:var(--field);border-color:transparent}
.th-ano .msg{background:#262C36}
.th-ano .msg.me{background:#3F3561}
.th-ano .slot .tm{color:#fff}
.th-ano .hf img{border-color:var(--line);box-shadow:none}
.th-ano .cl-it.rent{background:rgba(201,184,255,.08)}
.th-ano .tl-qrbox{background:#fff}

/* светлое: те же шрифты и оттенки, кнопки тёмные */
.th-lt .side{background:#fff;border-right:1px solid var(--line)}
.th-lt .nav a{color:#2A2F3A}
.th-lt .nav a:hover{background:var(--soft)}
.th-lt .nav a.on{background:#121721;color:#fff}
.th-lt .kpi b{color:#121721}
.th-lt .click:hover{border-color:rgba(91,69,200,.45)}
.th-lt .btn{background:#1D222A;border-color:#1D222A;color:#fff}
.th-lt .btn:hover{background:#2F3642}
.th-lt .btn.danger{color:#FF9A9A}
.th-lt .btn.gold{background:#7C5CE6;border-color:#7C5CE6;color:#fff}
.th-lt .btn.brush,.th-lt #qa{background-image:url(https://corpdance.ru/brand/brush-dark.webp);color:#fff}
.th-lt .inp,.th-lt select.inp,.th-lt textarea.inp{background:var(--field);border-color:#DAD7E3;color:var(--text)}
.th-lt .chip,.th-lt .tabs a{background:#fff;border-color:#D6D3E0;color:#121721}
.th-lt .chip.on,.th-lt .tabs a.on{background:#121721;color:#fff;border-color:#121721}
.th-lt .tabs a:hover,.th-lt .chip:hover{border-color:#7C5CE6}
.th-lt .badge{background:rgba(124,92,230,.12);color:#5B45C8}
.th-lt .bar i{background:#7C5CE6}
.th-lt .hb .bar i{background:linear-gradient(90deg,#3F3561,#7C5CE6)}
.th-lt .t th,.th-lt .t tfoot td{background:#F6F5FA}
.th-lt .toast{background:#121721}
.th-lt .msg.me{background:#3F3561}
.th-lt .slot .tm{color:#121721}
.th-lt .menu{border:1px solid var(--line)}
.th-lt .ms{border-color:#DAD7E3;background:#fff}
.th-lt .cl-it.rent{background:rgba(124,92,230,.08)}
@media (max-width:900px){.brand h1{font-size:28px}.brand .kpi b{font-size:30px}.brand .top .ttl{font-size:18px}.brand #qa{padding:8px 48px;font-size:12.5px;letter-spacing:.04em}.brand .login h1{font-size:32px}}
</style>
</head>

};

function b64Blob(b64, mime) { const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type: mime}); }

  if (f.size > 10 * 1024 * 1024) throw new Error('Файл больше 10 МБ');
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(f); });
  await call('uploadContractFile', {id, name: f.name, mime: f.type || 'application/octet-stream', data});
}

    + (noSub.length ? `<div class="small muted" style="margin-top:10px">Без абонемента: ${noSub.slice(0, 8).map(x => `<a data-c="${x.id}" style="cursor:pointer">${esc(x.name)}</a>`).join(', ')}${noSub.length > 8 ? ' и ещё ' + (noSub.length - 8) : ''}</div>` : ''),

HOME_W.push({k: 'lessons', t: 'Занятия за период', html: () => `<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">Занятия за период</h2><button class="btn sm" id="hprn">${ic('print')}Печать</button></div>

  [{t: 'Как было', left: 1, fn: async () => { S.D.homeLayout = ''; await call('saveHome', {layout: {}}, true); VIEWS.home(); }},
   {t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async () => {

      wide: rows.filter(r => $('[data-wide]', r).checked).map(r => r.dataset.k), kpi: $$('#hkpi input', bg).filter(x => x.checked).map(x => x.value)};

VIEWS.home = () => {
  const D = S.D, t = today();
  const ui = S.ui.home || (S.ui.home = {mode: 'day', anchor: t, from: t, to: t});
  // границы периода
  const wkStart = d => addDays(d, -((new Date(d + 'T12:00:00Z').getUTCDay() + 6) % 7));
  const range = () => {
    const a = ui.anchor;
    if (ui.mode === 'day') return [a, a];
    if (ui.mode === 'week') return [wkStart(a), addDays(wkStart(a), 6)];
    if (ui.mode === 'month') return [monthStart(a), monthEnd(a)];
    if (ui.mode === 'year') return [a.slice(0, 4) + '-01-01', a.slice(0, 4) + '-12-31'];
    return [ui.from, ui.to];
  };
  const [from, to] = range();
  const shift = dir => {
    const a = ui.anchor;
    if (ui.mode === 'day') ui.anchor = addDays(a, dir);
    if (ui.mode === 'week') ui.anchor = addDays(a, 7 * dir);
    if (ui.mode === 'month') ui.anchor = monthStart(a, dir);
    if (ui.mode === 'year') ui.anchor = (+a.slice(0, 4) + dir) + a.slice(4);
    if (ui.mode === 'custom') { const len = Math.round((new Date(ui.to) - new Date(ui.from)) / 864e5) + 1; ui.from = addDays(ui.from, len * dir); ui.to = addDays(ui.to, len * dir); }
    VIEWS.home();
  };
  const label = ui.mode === 'day' ? `${wd(from)}, ${fd(from)}${from === t ? ' · сегодня' : ''}`
    : ui.mode === 'month' ? monthName(from).replace(/^./, c => c.toUpperCase())
    : ui.mode === 'year' ? from.slice(0, 4) + ' год'
    : `${fd(from)} — ${fd(to)}`;
  const modes = [['day', 'День'], ['week', 'Неделя'], ['month', 'Месяц'], ['year', 'Год'], ['custom', 'Период']];
  const L = homeLayout();
  const newSubs = D.subs.filter(s => s.startDate >= from && s.startDate <= to);
  const kpiNow = {subs: newSubs.length,
    income: money(sum(newSubs, s => +s.paid || 0)),
    rent: money(sum((D.rent || []).filter(r => r.date <= to && rentEnd(r) >= from), r => +r.amount || 0)),
    active: new Set(D.subs.filter(s => (s.status || 'active') === 'active' && ['ok', 'low'].includes(s.state)).map(s => s.clientId)).size,
    wait: D.bookings.filter(b => b.status === 'wait' && S.m.slots[b.slotId] && S.m.slots[b.slotId].date >= t).length};
  const ctx = {D, ui, from, to, t, label, L, newSubs, kpiNow};
  const shown = L.order.filter(k => !L.hidden.includes(k)).map(homeW).filter(w => w && (!w.admin || (typeof w.admin === 'function' ? w.admin() : role() === 'admin')));

  $('#main').innerHTML = `
    <div class="head"><div style="flex:1;min-width:180px"><h1>Главная</h1><p class="script hide-light">✦ ${esc(new Date(today() + 'T12:00:00').toLocaleDateString('ru-RU', {weekday: 'long', day: 'numeric', month: 'long'}))}</p></div><button class="btn" id="hset" title="Настроить Главную">${ic('cog')}<span class="hide-sm">Настроить</span></button><button class="btn pri" id="qa">${ic('check')}Отметить занятие</button></div>
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="gap:10px">
        <div class="chips">${modes.map(m => `<span class="chip ${ui.mode === m[0] ? 'on' : ''}" data-m="${m[0]}">${m[1]}</span>`).join('')}</div>
        <span class="spacer"></span>
        <button class="btn sm" id="hprev" title="Назад">${ic('back')}</button>
        <b style="min-width:150px;text-align:center">${esc(label)}</b>
        <button class="btn sm" id="hnext" title="Вперёд" style="transform:scaleX(-1)">${ic('back')}</button>
        <button class="btn sm" id="htoday">Сегодня</button>
      </div>
      ${ui.mode === 'custom' ? `<div class="row" style="gap:6px;margin-top:10px"><input type="date" class="inp" id="hf" value="${from}" style="width:auto"> — <input type="date" class="inp" id="ht" value="${to}" style="width:auto"></div>` : ui.mode === 'day' ? `<div class="row" style="margin-top:10px"><input type="date" class="inp" id="hd" value="${from}" style="width:auto"></div>` : ''}
    </div>
    <div id="hbody" class="hgrid">${shown.map(w => {
      let h = '';
      try { h = w.html(ctx); } catch (e) { h = `<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`; reportError(e, 'home:' + w.k); }
      const wide = L.wide.includes(w.k);
      return w.k === 'kpi' || w.bare ? `<div class="hw ${wide ? 'wide' : ''}" data-w="${w.k}">${h}</div>` : `<div class="card hw ${wide ? 'wide' : ''}" data-w="${w.k}">${h}</div>`;
    }).join('') || `<div class="card wide">${empty('Все блоки скрыты — нажмите «Настроить»')}</div>`}</div>`;

  $('#qa').onclick = () => lessonForm({date: ui.mode === 'day' ? from : undefined});
  $('#hset').onclick = homeSetup;
  shown.forEach(w => { if (w.after) { try { w.after(ctx); } catch (e) { reportError(e, 'home:' + w.k); } } });
  $$('[data-m]').forEach(c => c.onclick = () => { ui.mode = c.dataset.m; if (ui.mode === 'custom') { ui.from = from; ui.to = to; } VIEWS.home(); });
  $('#hprev').onclick = () => shift(-1);
  $('#hnext').onclick = () => shift(1);
  $('#htoday').onclick = () => { ui.anchor = today(); if (ui.mode === 'custom') { ui.mode = 'day'; } VIEWS.home(); };
  if ($('#hd')) $('#hd').onchange = e => { if (e.target.value) { ui.anchor = e.target.value; VIEWS.home(); } };
  if ($('#hf')) $('#hf').onchange = e => { if (e.target.value) { ui.from = e.target.value; if (ui.to < ui.from) ui.to = ui.from; VIEWS.home(); } };
  if ($('#ht')) $('#ht').onchange = e => { if (e.target.value) { ui.to = e.target.value; if (ui.from > ui.to) ui.from = ui.to; VIEWS.home(); } };
  $$('#hbody [data-c]').forEach(e => e.onclick = () => { S.prev = ['home']; go('client', e.dataset.c); });
  $$('#hbody [data-go]').forEach(e => e.onclick = () => go(...e.dataset.go.split('/')));
  if ($('#hprn')) $('#hprn').onclick = () => printEl('Сводка: ' + label, $('#hbody'), fd(from) + ' — ' + fd(to));

  const key = from + '|' + to;
  const myPage = S.pageSeq;
  const alive = () => S.pageSeq === myPage && S.route[0] === 'home' && !(S.ui.home && range().join('|') !== key);
  // данные модулей (оценки, удержание, мероприятия, финансы) — одним запросом
  const clubW = shown.filter(w => w.club);
  if (clubW.length) swr('clubHome', {from, to, w: clubW.map(w => w.k)}, r => {
    if (!alive()) return;
    clubW.forEach(w => { try { w.fill(r, ctx); } catch (e) { reportError(e, 'home:' + w.k); } });
    $$('#hbody [data-c]').forEach(e => e.onclick = () => { S.prev = ['home']; go('client', e.dataset.c); });
  }, e => clubW.forEach(w => { const el = $('#hw-' + w.k); if (el) el.innerHTML = `<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`; }));
  if (!shown.some(w => ['kpi', 'trainers', 'types', 'lessons'].includes(w.k))) return;
  swr('report', {from, to}, r => {
    if (!alive()) return;
    const f = r.facts;
    const work = f.filter(x => x.n > 0);
    const hours = sum(work, x => x.th);
    const sessions = work.filter(x => !x.ev).length + new Set(work.filter(x => x.ev).map(x => x.ev)).size;
    const clients = new Set(f.filter(x => x.cl).map(x => x.cl)).size;
    const setK = (k, v) => { const b = $(`#hk [data-kpi="${k}"] b`); if (b) b.textContent = v; };
    setK('hours', fh(hours)); setK('sessions', sessions); setK('clients', clients);
    // по тренерам
    if ($('#htr')) {
      const byT = {};
      work.forEach(x => { const o = byT[x.tr] = byT[x.tr] || {h: 0, n: 0, a: 0}; o.h += x.th; o.n += x.n; const tr = S.m.trainers[x.tr]; if (tr) o.a += payX(tr, x); });
      const tk = Object.keys(byT).sort((a, b) => byT[b].h - byT[a].h);
      const mx = Math.max(1, ...tk.map(x => byT[x].h));
      $('#htr').innerHTML = tk.length ? `<div class="hbars">${tk.map(id => `<div class="hb"><span><a style="cursor:pointer" data-t="${id}">${esc(tName(id))}</a></span><div class="bar"><i style="width:${byT[id].h / mx * 100}%"></i></div><span class="right"><b>${fh(byT[id].h)} ч</b></span></div>`).join('')}</div>
        <div class="small muted" style="margin-top:8px">По ставкам за период: <b style="color:var(--text)">${money(sum(tk, id => byT[id].a))}</b>${work.some(ownPay) ? ` · без абонемента ${fh(sum(work.filter(ownPay), x => x.th))} ч (платят ученики тренерам, не входит)` : ''}</div>` : empty('Занятий нет');
      $$('#htr [data-t]').forEach(a => a.onclick = () => { S.ui.tr = {from, to, preset: 'c'}; go('trainer', a.dataset.t); });
    }
    // по видам
    if ($('#hty')) {
      const byY = {};

function canEditLesson(l) {
  if (l.eventId) return false;
  if (isStaff()) return true;
  if (role() !== 'trainer' || l.trainerId !== S.user.trainerId) return false;
  const days = +S.D.settings.trainerEditDays || 7;
  return (new Date(today()) - new Date((l.createdAt || l.date).slice(0, 10))) / 864e5 <= days;
}

      <div class="card stack">
        <div class="row"><div class="avatar ${staff || self ? 'edit' : ''}" data-av="trainer:${t.id}" data-avn="${esc(t.name)}" title="${staff || self ? 'Фото' : ''}" style="width:52px;height:52px;font-size:18px">${initials(t.name)}</div>
          <div class="grow chips">${progs(t.programs || t.spec).map(p => `<span class="badge">${esc(p)}</span>`).join('') || '<span class="small muted">Программы не указаны</span>'}</div></div>

        ${t.notes ? `<div class="small" style="background:var(--soft);padding:8px 10px;border-radius:8px">${esc(t.notes)}</div>` : ''}

        ${staff ? `<div><h3 style="margin-bottom:6px">Ставки</h3><div class="kv">${dictList('type').map(ty => { const r = rateOf(t, ty.id); return r ? `<span class="k"><span class="dot" style="background:${esc(ty.color)}"></span>${esc(ty.name)}</span><span>${money(r)} ${ty.mode === 'fixed' ? 'за участие' : 'в час'}${rates[ty.id] === undefined ? ' <span class="small muted">(по умолч.)</span>' : ''}</span>` : ''; }).join('') || '<span class="muted small">Ставки не заданы</span>'}</div></div>` : ''}
        <div><h3 style="margin-bottom:6px">Группы</h3><div class="chips">${myGroups.map(g => `<span class="badge click" data-g="${g.id}" style="background:${esc(typeColor(g.typeId))}22;color:${esc(typeColor(g.typeId))}">${esc(g.name)}</span>`).join('') || '<span class="small muted">Нет постоянных групп</span>'}</div></div>
      </div>
    </div>
    <div class="sect">${pp.html}</div>
    <div id="trr" class="sect"><div class="empty">Загрузка…</div></div>`;
  pp.wire($('#main'));
  wireCtr($('#main'));
  $$('[data-g]').forEach(b => b.onclick = () => { S.ui.gr = {arch: false, t: '', open: b.dataset.g}; go('groups'); });
  if ($('#bk')) $('#bk').onclick = () => go('trainers');
  if (staff) {
    $('#ed').onclick = () => trainerForm(t);
    $('#act').onclick = () => actDialog(t.id, pp.p.from, pp.p.to);
    if ($('#ct')) $('#ct').onclick = contractBtn('trainer', t.id);
  }
  if ($('#acc')) $('#acc').onclick = () => userForm({role: 'trainer', trainerId: t.id, name: t.name});
  let R = null;
  const cn = cid => (S.m.clients[cid] || ((R && R.clients) || []).find(c => c.id === cid) || {}).name || '—';
  $('#hprn').onclick = () => R ? showDoc('История занятий — ' + t.name, trainerHistoryDoc(t, pp.p, R.facts.filter(x => x.tr === t.id), cn, staff), fd(pp.p.from) + ' — ' + fd(pp.p.to)) : toast('Подождите, данные загружаются');
  const myPage = S.pageSeq;
  call('report', {from: pp.p.from, to: pp.p.to, trainerId: t.id}).then(r => {
    if (S.pageSeq !== myPage || !$('#trr')) return;
    R = r;
    const f = r.facts.filter(x => x.tr === t.id);
    const by = {};
    f.filter(x => x.n > 0).forEach(x => { const o = by[x.type] = by[x.type] || {h: 0, u: 0}; o.h += x.th; o.u += x.n; });
    const tkeys = Object.keys(by).sort((a, b) => (+typeInfo(a).order || 0) - (+typeInfo(b).order || 0));
    const total = sum(tkeys, k => by[k].h);
    const bp = {};
    f.filter(x => x.n > 0 && !ownPay(x)).forEach(x => { const o = bp[x.type] = bp[x.type] || {h: 0, u: 0}; o.h += x.th; o.u += x.n; });
    const amount = staff ? sum(Object.keys(bp), k => payOf(t, k, bp[k].h, bp[k].u)) : 0;
    const ownH = sum(f.filter(x => x.n > 0 && ownPay(x)), x => x.th);
    const byC = {};
    f.filter(x => x.cl).forEach(x => { const o = byC[x.cl] = byC[x.cl] || {ind: 0, grp: 0, n: 0}; if (!x.ev) { o.ind += x.ch; o.n++; } else o.grp += x.ch; });
    const assigned = (S.D.clients || []).filter(c => c.active && (ids(c.trainerIds).includes(t.id) || self));
    assigned.forEach(c => { byC[c.id] = byC[c.id] || {ind: 0, grp: 0, n: 0}; });
    const keys = Object.keys(byC).sort((a, b) => (byC[b].ind + byC[b].grp) - (byC[a].ind + byC[a].grp) || cn(a).localeCompare(cn(b)));
    const evs = r.events.filter(e => f.some(x => x.ev === e.id && x.n > 0)).sort((a, b) => b.date.localeCompare(a.date));
    const inds = f.filter(x => !x.ev).sort((a, b) => b.date.localeCompare(a.date));
    $('#trr').innerHTML = `
      <div class="kpis">
        <div class="kpi"><b>${fh(total)}</b><span>часов всего</span></div>
        ${tkeys.map(k => `<div class="kpi"><b style="color:${esc(typeColor(k))}">${typeInfo(k).mode === 'fixed' ? by[k].u : fh(by[k].h)}</b><span>${esc(typeInfo(k).name)}${typeInfo(k).mode === 'fixed' ? ' — участий' : ', ч'}</span></div>`).join('')}
        ${staff ? `<div class="kpi"><b>${money(amount)}</b><span>к оплате клубом</span></div>` : ''}
        ${ownH ? `<div class="kpi"><b style="color:var(--muted)">${fh(ownH)}</b><span>ч без абонемента — платит ученик, не входит</span></div>` : ''}
      </div>
      <div class="sect"><h2>Ученики — кто с кем и сколько</h2><div class="tw"><table class="t"><thead><tr><th>Ученик</th><th class="n">Индивид., ч</th><th class="n">В группах, ч</th><th class="n">Занятий</th><th>Абонемент</th></tr></thead><tbody>
        ${keys.map(k => { const sm = clientSummary(k); return `<tr class="click" data-c="${k}"><td>${esc(cn(k))}</td><td class="n">${fh(byC[k].ind)}</td><td class="n">${fh(byC[k].grp)}</td><td class="n">${byC[k].n}</td><td><span class="badge ${{ok: 'ok', warn: 'warn', bad: 'bad', none: ''}[sm.cls]}">${sm.label}</span></td></tr>`; }).join('') || `<tr><td colspan="5">${empty('Нет учеников')}</td></tr>`}
      </tbody></table></div></div>
      <div class="sect"><h2>Группы, сборы, мероприятия, турниры</h2><div class="tw"><table class="t"><thead><tr><th>Дата</th><th>Вид</th><th>Название</th><th>Место</th><th class="n">Часов</th><th class="n">Участников</th></tr></thead><tbody>
        ${evs.map(e => `<tr><td class="nowrap">${fd(e.date)}</td><td>${typeBadge(e.type)}</td><td>${esc(e.title)}${e.results ? `<div class="small muted">${esc(e.results)}</div>` : ''}</td><td>${esc(e.location || '')}</td><td class="n">${fh(e.hours)}</td><td class="n">${ids(e.clientIds).length}</td></tr>`).join('') || `<tr><td colspan="6">${empty('За период нет')}</td></tr>`}
      </tbody></table></div></div>
      <div class="sect"><h2>Индивидуальные занятия</h2><div class="tw"><table class="t"><thead><tr><th>Дата</th><th>Ученик</th><th class="n">Часов</th></tr></thead><tbody>
        ${inds.map(x => `<tr><td>${fd(x.date)} <span class="muted small">${wd(x.date)}</span></td><td>${esc(cn(x.cl))}${ownPay(x) ? ' <span class="badge" title="' + OWN_NOTE + '">без абонемента</span>' : ''}</td><td class="n">${fh(x.th)}</td></tr>`).join('') || `<tr><td colspan="3">${empty('За период нет')}</td></tr>`}
      </tbody></table></div></div>`;
    $$('#trr [data-c]').forEach(e => e.onclick = () => { if (S.m.clients[e.dataset.c] && (staff || (S.D.clients || []).some(c => c.id === e.dataset.c))) { S.prev = S.route; go('client', e.dataset.c); } });
  }).catch(fail);
};

// --- расписание ---
VIEWS.schedule = () => {
  const ui = S.ui.sc || (S.ui.sc = {from: addDays(today(), -((new Date(today() + 'T12:00:00Z').getUTCDay() + 6) % 7)), tr: ''});
  const to = addDays(ui.from, 6);
  const staff = isStaff();
  let slots = S.D.slots.filter(s => s.date >= ui.from && s.date <= to && (!ui.tr || s.trainerId === ui.tr));
  const days = [];
  for (let i = 0; i < 7; i++) days.push(addDays(ui.from, i));
  $('#main').innerHTML = `
    <div class="head"><h1>Расписание</h1><button class="btn pri" id="ns">${ic('plus')}Слот для записи</button></div>
    <div class="row" style="margin-bottom:6px"><button class="btn sm" id="pw">${ic('back')}</button>
      <b>${fd(ui.from)} — ${fd(to)}</b><button class="btn sm" id="nw" style="transform:scaleX(-1)">${ic('back')}</button>
      <button class="btn sm" id="tw">Эта неделя</button><span class="spacer"></span>
      ${staff ? sel('tr', trOpts(false, 'Все тренеры'), ui.tr, 'id="trf" style="width:auto"') : ''}</div>
    <p class="small muted" style="margin:4px 0 0">Ученики видят открытые слоты и записываются сами. После занятия нажмите «Отметить» — часы спишутся с абонементов.</p>
    ${days.map(d => {
      const ds = slots.filter(s => s.date === d).sort((a, b) => a.time.localeCompare(b.time));
      if (!ds.length) return '';
      return `<div class="day"><h3>${wd(d)}, ${fd(d)}${d === today() ? ' · сегодня' : ''}</h3><div class="stack">${ds.map(s => {
        const bs = S.D.bookings.filter(b => b.slotId === s.id && ['booked', 'attended', 'missed'].includes(b.status));
        const wl = S.D.bookings.filter(b => b.slotId === s.id && b.status === 'wait');
        const st = s.status === 'done' ? '<span class="badge ok">Проведено</span>' : s.status === 'cancelled' ? '<span class="badge bad">Отменено</span>' : `<span class="badge">${bs.length}/${s.capacity} записано</span>`;
        return `<div class="card tight slot"><div class="tm">${esc(s.time)}</div><div class="grow">
          <div class="row"><b class="grow">${esc(s.title)}</b>${st}</div>
          <div class="small muted">${staff ? esc(tName(s.trainerId)) + ' · ' : ''}${TYPE[s.type]} · ${fh(s.hours)} ч${s.hall ? ' · ' + esc(s.hall) : ''}</div>
          ${bs.length ? `<div class="small" style="margin-top:4px">${bs.map(b => `${esc(b.clientName)}${b.status === 'attended' ? ' ✓' : b.status === 'missed' ? ' ✗' : ''}`).join(', ')}</div>` : ''}
          ${wl.length && s.status === 'open' ? `<div class="small muted" style="margin-top:2px">⏳ Ожидают: ${wl.map(b => esc(b.clientName)).join(', ')}</div>` : ''}
          ${s.status === 'open' ? `<div class="row" style="margin-top:8px"><button class="btn sm pri" data-done="${s.id}">${ic('check')}Отметить</button><button class="btn sm" data-ed="${s.id}">Изменить</button><button class="btn sm danger" data-cx="${s.id}">Отменить</button></div>` : ''}
        </div></div>`;
      }).join('')}</div></div>`;
    }).join('') || `<div class="card sect">${empty('На этой неделе слотов нет')}</div>`}`;
  $('#pw').onclick = () => { ui.from = addDays(ui.from, -7); VIEWS.schedule(); };
  $('#nw').onclick = () => { ui.from = addDays(ui.from, 7); VIEWS.schedule(); };
  $('#tw').onclick = () => { S.ui.sc = null; VIEWS.schedule(); };
  if ($('#trf')) $('#trf').onchange = e => { ui.tr = e.target.value; VIEWS.schedule(); };
  $('#ns').onclick = () => slotForm({date: ui.from < today() ? today() : ui.from});
  $$('[data-ed]').forEach(b => b.onclick = () => slotForm(S.m.slots[b.dataset.ed]));
  $$('[data-cx]').forEach(b => b.onclick = async () => { if (!(await askYes('Отменить слот? Записанные ученики увидят отмену.'))) return; try { await call('cancelSlot', {id: b.dataset.cx}); toast('Слот отменён'); await reload(); } catch (e) { fail(e); } });
  $$('[data-done]').forEach(b => b.onclick = () => completeSlotForm(S.m.slots[b.dataset.done]));
};
function slotForm(o) {
  o = o || {};
  const bg = modal(o.id ? 'Слот' : 'Новый слот для записи', `<div class="fg">
    ${role() === 'trainer' ? '' : fld('Тренер', sel('trainerId', trOpts(false, '— выберите —'), o.trainerId || ''), 'full')}
    <div class="full chips">${typesOf(['ind', 'group']).map(x => [x.id, x.name]).map(x => `<label class="chip ${(o.type || 'ind') === x[0] ? 'on' : ''}"><input type="radio" name="type" value="${esc(x[0])}" ${(o.type || 'ind') === x[0] ? 'checked' : ''} hidden>${esc(x[1])}</label>`).join('')}</div>
    ${fld('Название', inp('title', o.title || '', 'placeholder="Необязательно"'), 'full')}
    ${fld('Дата', inp('date', o.date || today(), 'type="date"'))}
    ${fld('Время', inp('time', o.time || '18:00', 'type="time"'))}
    ${fld('Часов', inp('hours', o.hours || 1, 'type="number" step="0.25" min="0.25"'))}
    ${fld('Мест (для групповых)', inp('capacity', o.capacity || 10, 'type="number" min="1"'))}
    ${fld('Зал', sel('hall', [['', '—']].concat(String(S.D.settings.halls || '').split(',').map(x => x.trim()).filter(Boolean).map(h => [h, typeof HL !== 'undefined' ? HL.label(h) : h])), o.hall || ''))}
    ${o.id ? '' : fld('Повторять еженедельно', sel('repeatWeeks', [[0, 'Не повторять'], [3, '4 недели'], [7, '8 недель'], [11, '12 недель']], 0), 'full')}
    ${fld('Заметка', inp('notes', o.notes || ''), 'full')}
  </div>`, [{t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
    const v = vals(m); v.id = o.id;
    if (window.hallConflicts) { const c = hallConflicts({kind: 'slot', id: o.id, date: v.date, time: v.time, hours: v.hours, hall: v.hall}); if (c.length && !(await askYes('Зал занят: ' + c.join('; ') + '. Всё равно сохранить?', 'Сохранить'))) return false; }
    await call('saveSlot', v); toast('Сохранено'); await reload();
  }}]);
  $$('input[name=type]', bg).forEach(r => r.onchange = () => $$('input[name=type]', bg).forEach(x => x.parentNode.classList.toggle('on', x.checked)));
}
function completeSlotForm(s) {
  const bs = S.D.bookings.filter(b => b.slotId === s.id && b.status === 'booked');
  const pool = (role() === 'trainer' ? S.D.allClients : S.D.clients.filter(c => c.active)).filter(c => !bs.some(b => b.clientId === c.id));
  const bg = modal('Отметить занятие: ' + esc(s.title), `
    <div class="small muted" style="margin-bottom:8px">${fd(s.date)} ${esc(s.time)} · отметьте пришедших</div>
    ${fld('Записавшиеся', bs.length ? `<div class="ms"><div class="ms-l">${bs.map(b => `<label><input type="checkbox" data-multi="1" name="clientIds" value="${b.clientId}" checked> ${esc(b.clientName)}</label>`).join('')}</div></div>` : '<div class="small muted">Никто не записался</div>')}
    <div style="height:10px"></div>
    ${fld('Добавить пришедших без записи', multi('clientIds', pool.sort((a, b) => a.name.localeCompare(b.name)).map(c => [c.id, c.name]), []))}
    <div style="height:10px"></div>${fld('Часов', inp('hours', s.hours, 'type="number" step="0.25" min="0.25"'))}`,
    [{t: 'Отмена'}, {t: ic('check') + 'Провести', cls: 'pri', fn: async m => { await call('completeSlot', Object.assign(vals(m), {id: s.id})); toast('Занятие отмечено, часы списаны'); await reload(); }}]);
  wireMulti(bg);
}

      <div class="grow"><b>${esc(e.title)}</b><div class="small muted">${fd(e.date)} ${esc(e.time)} · ${fh(e.hours)} ч${e.location ? ' · ' + esc(e.location) : ''} · ${esc(e.trainerNames)}</div>
      <div class="small">${ids(e.clientIds).length} участн.${e.deduct ? ' · списание с абонементов' : ''}${e.groupId && S.m.groups[e.groupId] ? ' · группа «' + esc(S.m.groups[e.groupId].name) + '»' : ''}</div>
      ${e.results ? `<div class="small" style="margin-top:4px">🏆 ${esc(e.results)}</div>` : ''}</div>
      ${typeBadge(e.type)}</div></div>`).join('') || `<div class="card">${empty('За период нет записей')}</div>`}</div>`;

  $('#eprn').onclick = () => showDoc('Занятия и события', `<h1>Занятия и события${ui.t ? ': ' + esc(typeInfo(ui.t).name) : ''}</h1><div class="muted">${fd(pp.p.from)} — ${fd(pp.p.to)}</div>
    <table><thead><tr><th>Дата</th><th>Вид</th><th>Название</th><th>Место</th><th>Тренеры</th><th class="n">Часов</th><th>Участники</th><th>Итоги</th></tr></thead><tbody>
    ${list.map(e => `<tr><td class="nowrap">${fd(e.date)} ${esc(e.time)}</td><td>${esc(typeInfo(e.type).name)}</td><td>${esc(e.title)}</td><td>${esc(e.location)}</td><td>${esc(e.trainerNames)}</td><td class="n">${fh(e.hours)}</td><td>${esc(e.clientNames)}</td><td>${esc(e.results)}</td></tr>`).join('') || '<tr><td colspan="8">Нет записей</td></tr>'}</tbody></table>`);
  $$('[data-e]').forEach(c => c.onclick = () => {
    const e = S.m.events[c.dataset.e];

    eventForm(e);
  });
};

// --- постоянные группы ---
VIEWS.groups = () => {
  const ui = S.ui.gr || (S.ui.gr = {arch: false, t: ''});
  const staff = isStaff();
  const types = typesOf(['group', 'event']);

function reportPivot(r, p) {
  const ui = S.ui.pv || (S.ui.pv = {rows: 'tr', cols: 'month', metric: 'th'});
  const DIMS = {tr: 'Тренер', cl: 'Ученик', company: 'Компания', type: 'Тип занятия', month: 'Месяц', week: 'Неделя', wd: 'День недели', none: '—'};
  const METR = {th: 'Часы тренеров', ch: 'Часы учеников', n: 'Количество занятий'};
  const keyOf = (x, d) => {
    if (d === 'tr') return tName(x.tr);
    if (d === 'cl') return x.cl ? cName(x.cl) : '(группа/мероприятие)';
    if (d === 'company') return x.cl ? ((S.m.clients[x.cl] || {}).company || '(не указана)') : '(группа/мероприятие)';
    if (d === 'type') return TYPE[x.type];
    if (d === 'month') return x.date.slice(0, 7);
    if (d === 'week') { const m = addDays(x.date, -((new Date(x.date + 'T12:00:00Z').getUTCDay() + 6) % 7)); return 'с ' + fd(m); }
    if (d === 'wd') return ((new Date(x.date + 'T12:00:00Z').getUTCDay() + 6) % 7 + 1) + ' ' + wd(x.date);
    return 'Итого';
  };
  const draw = () => {
    const facts = r.facts.filter(x => ui.metric === 'ch' ? x.ch > 0 : ui.metric === 'th' ? x.th > 0 : x.n > 0);
    const val = x => ui.metric === 'n' ? x.n : x[ui.metric];
    const M = {}, rk = new Set(), ck = new Set();
    facts.forEach(x => { const a = keyOf(x, ui.rows), b = keyOf(x, ui.cols); rk.add(a); ck.add(b); M[a + '\u0001' + b] = (M[a + '\u0001' + b] || 0) + val(x); });
    const cols = [...ck].sort(), rows = [...rk].sort((a, b) => ['month', 'week', 'wd'].includes(ui.rows) ? a.localeCompare(b) : 0);
    const rt = k => sum(cols, c => M[k + '\u0001' + c] || 0);
    if (!['month', 'week', 'wd'].includes(ui.rows)) rows.sort((a, b) => rt(b) - rt(a));
    const ct = c => sum(rows, k => M[k + '\u0001' + c] || 0);
    const label = (d, k) => d === 'month' ? monthName(k + '-01') : k;
    const fmt = v => ui.metric === 'n' ? String(v) : fh(v);
    const mx = Math.max(1, ...rows.map(rt));
    $('#pvt').innerHTML = rows.length ? `
      <div class="card sect" style="margin-top:0"><div class="hbars">${rows.slice(0, 25).map(k => `<div class="hb"><span>${esc(label(ui.rows, k))}</span><div class="bar"><i style="width:${rt(k) / mx * 100}%"></i></div><span class="right"><b>${fmt(rt(k))}</b></span></div>`).join('')}</div></div>
      <div class="tw sect"><table class="t"><thead><tr><th>${DIMS[ui.rows]}</th>${ui.cols === 'none' ? '' : cols.map(c => `<th class="n">${esc(label(ui.cols, c))}</th>`).join('')}<th class="n">Итого</th></tr></thead><tbody>
      ${rows.map(k => `<tr><td>${esc(label(ui.rows, k))}</td>${ui.cols === 'none' ? '' : cols.map(c => `<td class="n">${M[k + '\u0001' + c] ? fmt(M[k + '\u0001' + c]) : '<span class="muted">·</span>'}</td>`).join('')}<td class="n"><b>${fmt(rt(k))}</b></td></tr>`).join('')}
      </tbody><tfoot><tr><td>Итого</td>${ui.cols === 'none' ? '' : cols.map(c => `<td class="n">${fmt(ct(c))}</td>`).join('')}<td class="n">${fmt(sum(rows, rt))}</td></tr></tfoot></table></div>` : `<div class="card">${empty('Нет данных за период')}</div>`;
    $('#csv').onclick = () => tableCsv('Отчёт ' + p.from + '_' + p.to, [DIMS[ui.rows]].concat(ui.cols === 'none' ? [] : cols.map(c => label(ui.cols, c))).concat(['Итого']),
      rows.map(k => [label(ui.rows, k)].concat(ui.cols === 'none' ? [] : cols.map(c => fmt(M[k + '\u0001' + c] || 0))).concat([fmt(rt(k))])));
  };
  const dsel = (id, v, noNone) => `<select class="inp" id="${id}" style="width:auto">${Object.entries(DIMS).filter(e => !(noNone && e[0] === 'none')).map(e => `<option value="${e[0]}" ${v === e[0] ? 'selected' : ''}>${e[1]}</option>`).join('')}</select>`;
  $('#rr').innerHTML = `<div class="row" style="margin-bottom:12px">
    <span class="small muted">Строки</span>${dsel('pr', ui.rows, true)}<span class="small muted">Столбцы</span>${dsel('pc', ui.cols)}
    <span class="small muted">Показатель</span><select class="inp" id="pm" style="width:auto">${Object.entries(METR).map(e => `<option value="${e[0]}" ${ui.metric === e[0] ? 'selected' : ''}>${e[1]}</option>`).join('')}</select>
    <span class="spacer"></span><button class="btn sm" id="prn">${ic('print')}Печать</button><button class="btn sm" id="csv">${ic('dl')}CSV</button></div><div id="pvt"></div>`;
  $('#prn').onclick = () => printEl('Отчёт: ' + DIMS[ui.rows] + (ui.cols !== 'none' ? ' × ' + DIMS[ui.cols] : '') + ' — ' + METR[ui.metric], $('#pvt'), fd(p.from) + ' — ' + fd(p.to));
  $('#pr').onchange = e => { ui.rows = e.target.value; draw(); };
  $('#pc').onchange = e => { ui.cols = e.target.value; draw(); };
  $('#pm').onchange = e => { ui.metric = e.target.value; draw(); };
  draw();
}

function rentForm(o) {

    ${fld('Арендатор', inp('renter', o.renter, 'list="renters"') + `<datalist id="renters">${[...new Set(S.D.rent.map(x => x.renter))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>`, 'full')}

    ${fld('<span data-u="hour">Время</span><span data-u="day">Время (если важно)</span>', inp('time', o.time || '', 'type="time"'))}
    ${fld('<span data-u="hour">Часов</span><span data-u="day">Часов в день (необязательно)</span>', inp('hours', unit === 'day' ? (+o.hours || '') : (o.hours || 1), 'type="number" step="0.5" min="0"'))}
    ${fld('Зал', sel('hall', [['', '—']].concat(halls.map(h => [h, typeof HL !== 'undefined' ? HL.label(h) : h])), o.hall || ''))}
    ${fld('Сумма, ₽', inp('amount', o.amount || '', 'type="number" min="0"'))}<div style="align-self:end">${chk('paid', 'Оплачено', o.paid)}</div>
    <div class="full small muted" data-u="day" id="rdays"></div>
    ${fld('Заметки', inp('notes', o.notes), 'full')}
    <div class="full sect-t">Договор</div>
    ${fld('Договор аренды', sel('ctr', ctrOpts, mode), 'full')}
    <div class="full small muted">Один договор можно указать для многих аренд — как рамочный.</div>
    <div class="full" data-new style="display:none"><div class="fg">
      ${fld('№ нового договора', `<div class="row" style="gap:6px;flex-wrap:nowrap"><input class="inp" name="contractNo" placeholder="пусто — следующий по счётчику"><button type="button" class="btn sm" data-autono2="1">Авто</button></div>`)}
      ${fld('Дата договора', inp('contractDate', today(), 'type="date"'))}${fld('Действует до', inp('contractEnd', '', 'type="date"'))}</div></div>
  </div>`, [
    o.id ? {t: ic('trash') + 'Удалить', cls: 'danger', left: 1, fn: () => rentDelete(o.id)} : null,
    {t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
      const v = vals(m); v.id = o.id;
      const c = v.ctr || 'none'; delete v.ctr;
      if (c === 'keep') { v.contractMode = ''; v.contractNo = o.contractNo; }
      else if (c === 'new') v.contractMode = 'new';
      else if (c.indexOf('c:') === 0) { v.contractMode = 'existing'; v.contractId = c.slice(2); }

      if (v.unit !== 'day') delete v.endDate;

    if (c) { $('[name=ctr]', bg).value = 'c:' + c.id; upd(); }
  });
  $('[data-autono2]', bg).onclick = () => autoNo(bg, 'rent');
  upd();
}

function contractForm(o) {

  const bg = modal(o.id ? 'Договор № ' + esc(o.number) : 'Новый договор', `<div class="fg">

    <div class="full" data-party></div>
    ${fld('Дата', inp('date', o.date || today(), 'type="date"'))}
    ${fld('Действует до', inp('endDate', o.endDate || '', 'type="date"'))}
    ${fld('Сумма, ₽', inp('amount', +o.amount || '', 'type="number" min="0"'))}
    ${fld('Заметки', inp('notes', o.notes), 'full')}
    ${fld('Файл договора (скан, PDF, до 10 МБ)', `${o.fileId ? `<div class="row" style="margin-bottom:6px"><span class="badge">${ic('clip', 12)} ${esc(o.fileName || 'файл')}</span><button type="button" class="btn sm" id="fview">${ic('eye')}Открыть</button><button type="button" class="btn sm danger" id="frm">Убрать файл</button></div>` : ''}<input type="file" id="cfile" class="inp" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx">`, 'full')}
  </div>`, [
    o.id ? {t: ic('trash') + 'Удалить', cls: 'danger', left: 1, fn: async () => { if (!(await askYes('Удалить договор № ' + o.number + '? Номер освободится, у стороны договора он исчезнет.'))) return false; await call('deleteContract', {id: o.id}); toast('Удалено'); await reload(); }} : null,
    {t: 'Отмена'},
    {t: 'Сохранить', cls: 'pri', fn: async m => {
      const v = vals(m); v.id = o.id;
      const r = await call('saveContract', v);
      const f = $('#cfile', m).files[0];
      if (f) { toast('Загружаю файл…'); await uploadFile(r.id, f); }
      toast('Договор № ' + r.number + ' сохранён'); await reload();
    }}].filter(Boolean), {wide: true});
  const party = () => {
    const k = $('[name=kind]', bg).value;
    const nRent = o.number ? (S.D.rent || []).filter(r => r.contractNo === o.number).length : 0;
    $('[data-party]', bg).innerHTML = k === 'rent' ? fld('Арендатор', inp('partyName', o.kind === 'rent' ? o.partyName : '', 'list="ctrrenters"') + `<datalist id="ctrrenters">${[...new Set((S.D.rent || []).map(x => x.renter))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>`
        + (nRent ? `<div class="small muted" style="margin-top:4px">Аренд по этому договору: ${nRent}</div>` : `<div class="small muted" style="margin-top:4px">Договор можно указывать во многих арендах — как рамочный.</div>`))
      : k === 'other' ? fld('Сторона договора', inp('partyName', o.kind === 'other' ? o.partyName : ''))
      : fld('Сторона договора', sel('partyId', [['', '— выберите —']].concat(partyList(k)), o.kind === k ? o.partyId : ''));
  };
  $('[name=kind]', bg).onchange = () => { party(); if (!o.id) autoNo(bg, $('[name=kind]', bg).value); };
  party();
  $('#cauto', bg).onclick = () => autoNo(bg, $('[name=kind]', bg).value);
  if (!o.id && !o.number) autoNo(bg, kind);
  if ($('#fview', bg)) $('#fview', bg).onclick = () => viewFile(o.fileId).catch(fail);
  if ($('#frm', bg)) $('#frm', bg).onclick = async () => { if (!(await askYes('Убрать файл из договора?'))) return; try { await call('removeContractFile', {id: o.id}); toast('Файл удалён'); await reload(); bg.remove(); } catch (e) { fail(e); } };
}

// --- чат ---
let pollT = null;
function stopPoll() { if (pollT) { clearInterval(pollT); pollT = null; } }
VIEWS.news = () => VIEWS.chat('news');
VIEWS.chat = (ch) => {
  ch = ch || (role() === 'client' ? 'news' : (S.ui.ch || 'staff')); S.ui.ch = ch;
  const canWrite = ch === 'staff' ? role() !== 'client' : isStaff();
  $('#main').innerHTML = `<div class="head"><h1>${role() === 'client' ? 'Объявления' : 'Чат'}</h1></div>
    ${role() === 'client' ? '' : `<div class="tabs"><a data-ch="staff" class="${ch === 'staff' ? 'on' : ''}">Тренерская</a><a data-ch="news" class="${ch === 'news' ? 'on' : ''}">Объявления для учеников</a></div>`}
    <div class="card chat" style="padding:0"><div class="msgs" id="msgs"><div class="empty">Загрузка…</div></div>
    ${canWrite ? `<form id="mf"><input class="inp" name="t" placeholder="${ch === 'news' ? 'Текст объявления…' : 'Сообщение…'}" autocomplete="off"><button class="btn pri">Отправить</button></form>` : ''}</div>`;
  $$('[data-ch]').forEach(a => a.onclick = () => go('chat', a.dataset.ch));
  let last = '';
  const load = quiet => call('getMessages', {channel: ch}, quiet).then(list => {
    const sig = list.length + (list.length ? list[list.length - 1].id : '');
    if (sig === last) return; last = sig;
    const box = $('#msgs'); if (!box) return;
    box.innerHTML = list.map(m => `<div class="msg ${m.userId === S.user.id ? 'me' : ''}"><div class="who">${esc(m.userName)}</div><div class="txt">${esc(m.text)}</div><div class="when">${esc(m.createdAt.slice(8, 10) + '.' + m.createdAt.slice(5, 7) + ' ' + m.createdAt.slice(11, 16))}</div></div>`).join('') || empty(ch === 'news' ? 'Объявлений пока нет' : 'Сообщений пока нет — напишите первым');
    box.scrollTop = box.scrollHeight;
  }).catch(e => { if (!quiet) fail(e); });
  load();
  stopPoll(); pollT = setInterval(() => { if (document.visibilityState === 'visible' && $('#msgs')) load(true); else if (!$('#msgs')) stopPoll(); }, 20000);
  if ($('#mf')) $('#mf').onsubmit = async e => {
    e.preventDefault(); const i = $('[name=t]', e.target); const text = i.value.trim(); if (!text) return;
    i.value = '';
    try { await call('postMessage', {channel: ch, text}, true); load(true); } catch (er) { i.value = text; fail(er); }
  };
};

    <p>Менеджера или администратора заводят в <b>Пользователи → ＋ Пользователь</b>. Там же сбрасывают пароль и закрывают доступ (галка «Доступ разрешён»).</p>
    <p>Человек с выданным логином, подключённый к Telegram-боту, может входить и без пароля: кнопка «🔑 Войти в приложение» в боте. Забытый пароль можно не сбрасывать — достаточно войти через бота и сменить пароль в меню.</p>
    ${fig('users', 'Пользователи и роли')}`},
  {id: 'settings', t: 'Настройки', r: ['admin'], b: () => `
    <p>Во вкладках «Настроек» администратор добавляет виды занятий (ставка, оплата за час или за участие, списание с абонемента), программы, свои поля для тренеров и учеников, меняет нумерацию договоров и параметры резервных копий. В «Базе данных» — журнал ошибок и скорость.</p>
    ${fig('settings', 'Настройки: виды занятий')}`},
  {id: 'tr-start', t: 'Мои ученики и часы', r: ['trainer'], b: () => `
    <p>На странице «Мои ученики» — ваши ученики и остаток часов по абонементам. «Мои часы» показывают занятия и сумму за период; историю можно напечатать.</p>
    ${fig('trainer-me', 'Мои часы за период')}
    ${steps(['Нажмите «Отметить занятие».', 'Выберите ученика, дату и часы.', '«Сохранить» — часы спишутся с абонемента.'])}
    <p>Ученики записываются на ваши слоты в приложении и через Telegram-бота; кто записан — видно в «Расписании». После занятия бот попросит ученика оценить его. Если вас заменили или занятие отменили, бот пришлёт сообщение.</p>
    <p><b>Домашнее задание:</b> в «Инструменты → Паспорт танцора» при записи в дневник отметьте «Это домашнее задание» — ученик получит его в Telegram вместе со ссылкой на видео.</p>
    <p><b>Фото профиля:</b> кружок справа вверху → «Фото профиля». Фото можно подвинуть и приблизить.</p>`},
  {id: 'cl-start', t: 'Абонементы и запись', r: ['client'], b: () => `
    <p>«Мои абонементы» — остаток часов и история занятий. В «Записи на занятие» выберите свободный слот и нажмите «Записаться». Отменить запись можно там же.</p>
    <p>Если мест нет — нажмите <b>«В лист ожидания»</b>. Когда кто-то отменит запись, вы будете записаны автоматически, а бот пришлёт сообщение.</p>
    <p>В Telegram-боте клуба то же самое делается кнопками: «📅 Расписание» — записаться или отменить, «🗓 Мои записи», «⏳ Остаток часов», «🎉 Мероприятия». За 3 часа до занятия бот спросит «Вы придёте?», а после — попросит оценить занятие.</p>
    <p>Фото профиля: нажмите на кружок с инициалами справа вверху → «Фото профиля». Фото можно подвинуть и приблизить; оно одинаково на телефоне и компьютере.</p>
    <p>Фото и видео с занятий и турниров, где вас отметили, — в «Инструменты → Фото и видео».</p>
    ${fig('client-home', 'Мои абонементы')}`},
  {id: 'enter', t: 'Как открыть приложение', r: ['admin', 'manager', 'trainer', 'client'], b: () => `
    <p><b>Адрес приложения: corpdance.ru</b> — открывается в любом браузере на компьютере и телефоне.</p>
    <p><b>Как обычное приложение на телефоне:</b></p>
    <ul><li><b>Android</b> — в Telegram-боте клуба кнопка «📲 Приложение для Android» (или corpdance.ru/apk). Либо откройте corpdance.ru в Chrome → меню ⋮ → «Установить приложение».</li>
      <li><b>iPhone</b> — откройте corpdance.ru в Safari → «Поделиться» → «На экран „Домой“».</li></ul>
    <p><b>Вход без пароля:</b> в боте клуба нажмите «🔑 Войти в приложение» — придёт одноразовая ссылка на 15 минут. Работает у тех, кому администратор выдал вход.</p>
    <p><b>Бот клуба:</b> corpdance.ru/bot. Если внизу в боте нет кнопок меню — отправьте боту /menu.</p>`},
  {id: 'homecfg', t: 'Настройка Главной и фото', r: STAFFR, b: () => `
    <p>Кнопка <b>«⚙ Настроить»</b> на Главной: отметьте, какие блоки показывать, расставьте их стрелками ▲▼, сделайте нужные «широкими» и выберите плитки показателей (часы, занятия, оплаты по абонементам, аренда, ученики с абонементом, листы ожидания). Настройка своя у каждого сотрудника и одинакова на всех его устройствах. «Как было» — вернуть стандартный вид.</p>
    <p>Доступные блоки: показатели, быстрые действия, по тренерам, по видам, расписание и аренда, абонементы, кому продлевать, перестали ходить, оценки тренеров, мероприятия, залы и пересечения, листы ожидания, дни рождения, финансы (только администратор), занятия за период.</p>
    <p><b>Где хранятся фото и видео.</b> Всё медиа лежит отдельно от основной таблицы: папка «Медиа — …» на Google Диске клуба (подпапки «Аватары» и «Фото и видео») и таблица «Медиа» в ней же (листы «Аватары» и «Галерея»). Ссылки на папку и таблицу — в «Инструменты → Фото и видео».</p>
    <p><b>Фото и видео с занятий и турниров.</b> «Инструменты → Фото и видео» → «Добавить»: файлы с телефона или компьютера (до 25 МБ) или ссылка на YouTube, Google Диск, VK. Отметьте мероприятие и учеников — ученики увидят только те фото и видео, где они отмечены. Галерея есть и в карточке мероприятия, и в паспорте танцора.</p>
    <p><b>Фото.</b> Откройте карточку ученика или тренера и нажмите на кружок с инициалами (значок 📷) → «Выбрать фото». Фото обрежется до квадрата. Своё фото — через кружок справа вверху → «Фото профиля». В приложении для Android выбор фото работает с версии APK 7.</p>`},
  {id: 'tools2', t: 'Продления, удержание, финансы', r: ['admin'], b: () => `
    <h3>Продления</h3><p>«Инструменты → Продления» — ученики, у которых заканчиваются часы или срок, а нового абонемента нет. «Напомнить» — сообщение в Telegram со ссылкой или реквизитами для оплаты; «QR» — QR-код для оплаты из банковского приложения (сумма и назначение подставятся); «Продлить» — сразу оформить новый абонемент. Реквизиты задаются кнопкой «Реквизиты для оплаты».</p>
    <h3>Удержание</h3><p>Кто перестал ходить: с абонементом, но не приходит, и кто занимался раньше, но абонемента нет. «Позвать» — тёплое сообщение в Telegram с кнопкой расписания, 📞 — позвонить, ✓ — отметить, что связались.</p>
    <h3>Оценки</h3><p>После занятия бот просит ученика поставить 1–5 звёзд и написать отзыв. Здесь — средняя оценка каждого тренера, распределение и низкие оценки, по которым стоит поговорить.</p>
    <h3>Мероприятия</h3><p>Корпоративные вечера, турниры, выступления: дата, место, репетиции. «Пригласить через бота» — ученики получат кнопку «🎉 Участвую». Бот напомнит накануне о мероприятии и репетициях. «Итоги» — результат и баллы каждому: попадут в корпоративную лигу и паспорт танцора, участники получат поздравление.</p>
    <h3>Залы</h3><p>Вверху — карточки залов клуба: фото, площадь, адрес (нажмите, чтобы открыть фото крупно). Кнопка «Загрузить с сайта ano.dance» берёт названия, площадь и фото с сайта клуба и привязывает их к залам приложения с похожими названиями; ✏ на карточке — поправить название, площадь или поставить своё фото; «＋ Зал» — карточка для зала, которого нет на сайте (галка «Добавить в список залов» сразу добавит его в формы). Фото хранятся в папке «Медиа/Залы» на Google Диске.</p><p>Ниже — календарь недели по залам: занятия и аренда. Красным — пересечения. Зал занятия выбирается в форме слота; при сохранении слота или аренды приложение предупредит, если зал занят.</p>
    <h3>Замена тренера</h3><p>Выберите тренера и период, отметьте занятия и назначьте замену или отмените их. Записанные ученики и новый тренер получат сообщение в Telegram. Отмена слота в «Расписании» тоже теперь сообщает записанным.</p>
    <h3>Финансы</h3><p>Доход (оплаченные абонементы и аренда), оплата тренерам по ставкам, прочие расходы (кнопка «＋ Расход»), прибыль по месяцам и маржа по компаниям. Статьи расходов настраиваются кнопкой «Статьи».</p>
    <h3>Ссылка для HR</h3><p>На вкладке «Отчёт для HR» выберите компанию и нажмите «Создать ссылку» — HR открывает отчёт по своим сотрудникам сам, без логина. Ссылку можно отключить в любой момент.</p>
    <h3>Домашние задания</h3><p>В паспорте танцора при записи в дневник отметьте «Это домашнее задание» — ученик получит его в Telegram вместе со ссылкой на видео. Видео с YouTube показываются превью.</p>
    <p class="note">Бот также поздравляет с днём рождения (текст меняется на вкладке «Telegram-бот») и сообщает ученику о начисленных баллах лиги.</p>`},
  {id: 'tools', t: 'Инструменты', r: ['admin'], b: () => `
    <p>Раздел <b>Инструменты</b> в меню — дополнительные возможности. Они работают отдельно и ничего не меняют в основных разделах.</p>
    <h3>Telegram-бот</h3>
    ${steps(['Администратор создаёт бота: в Telegram найдите <b>@BotFather</b>, отправьте <b>/newbot</b>, придумайте имя и адрес. Скопируйте токен и вставьте его на вкладке «Telegram-бот», нажмите «Сохранить».', 'Выберите, что отправлять: напоминания о записях, «мало часов», утренняя сводка сотрудникам, письмо тем, кто давно не приходил. И час отправки.', 'Распечатайте «Плакат для зала» с QR-кодом или отправьте общую ссылку в чат клуба. Человек наводит камеру, нажимает «Запустить» и «📱 Поделиться номером» — бот сам находит его по телефону из карточки. Тренеров с @ником в карточке бот узнаёт сразу.', 'Если номер не нашёлся, человек попадёт в список «Ждут подтверждения»: выберите, кто это, и нажмите «Подключить». Личная ссылка («Ссылка» в списке) тоже по-прежнему работает.', 'Галка «отправлять» включает и выключает уведомления конкретному человеку.'])}
    ${fig('tools-bot', 'Настройки бота и список получателей')}
    <p><b>Рассылка.</b> Кнопка «Новая рассылка» на вкладке «Telegram-бот»: выберите тип (объявление, важно, мероприятие, изменение расписания, технические работы), напишите заголовок и текст, отметьте, кому отправить — ученикам, тренерам, сотрудникам, конкретной группе или компании. Перед отправкой видно, сколько человек получат сообщение. Для срочного можно отправить и тем, кто выключил уведомления. Галка «Также опубликовать в Объявлениях» покажет сообщение ученикам и в приложении. Все рассылки сохраняются в журнале под кнопкой.</p>
    <p class="note">Команды в боте: /schedule — расписание и запись, /my — мои записи, /balance — остаток часов, /events — мероприятия, /next — ближайшие занятия, /stop — выключить уведомления, /on — включить снова. Ученики видят кнопки меню внизу экрана.</p>
    <h3>Подбор пары</h3>
    ${steps(['Выберите ученика. Нажмите «Анкета» и заполните рост, уровень, программы, удобные дни и галку «Ищет партнёра».', 'Система покажет кандидатов: противоположный пол, партнёр выше партнёрши на 5–20 см, общая программа, близкий уровень, общие дни. Зелёные метки — что совпало, серые — что не совпало.', 'Ниже — подходящие тренеры: по программе, росту для пары с учеником и загрузке.'])}
    ${fig('tools-pair', 'Подбор пары и тренера')}
    <h3>Паспорт танцора</h3>
    <p>Уровни ученика по каждому танцу (от «Начинающий» до «Турнирный») и дневник: после занятия тренер одной строкой пишет, что отработали, и может приложить ссылку на видео. Нажмите на карточку танца, чтобы отметить новый уровень. Паспорт можно распечатать. Ученик видит свой паспорт в приложении.</p>
    ${fig('tools-passport', 'Паспорт танцора')}
    <h3>Корпоративная лига</h3>
    <p>Компании соревнуются по баллам: за час занятий, участие в турнире, новый уровень в танце и награды. Баллы считаются сами по отмеченным занятиям. «＋ Баллы» — начислить награду (место на турнире, приведённый коллега). «Правила» — сезон и стоимость баллов.</p>
    ${fig('tools-league', 'Рейтинг компаний')}
    <h3>Отчёт для HR</h3>
    <p>Выберите компанию и период — получите отчёт: сколько сотрудников занимались, часы, турниры, рост уровня, место в лиге. Кнопка «Отчёт для HR» открывает документ для печати или PDF.</p>
    ${fig('tools-hr', 'Отчёт для HR компании')}
    `},
  {id: 'tools-me', t: 'Инструменты', r: ['manager', 'trainer', 'client'], b: () => role() === 'client' ? `
    <p>«Инструменты → Мой прогресс» — ваш паспорт танцора: уровни по каждому танцу, записи тренера после занятий и домашние задания. Отметьте «Ищу пару» и заполните анкету — тренеры подберут вам партнёра.</p>
    ${fig('tools-client', 'Мой прогресс')}
    <p>«Лига» — рейтинг компаний клуба и ваше место. «Фото и видео» — галерея с занятий и турниров, где вы отмечены. «Telegram» — подключите бота, чтобы записываться кнопками и получать напоминания и остаток часов.</p>
    <p class="note">Набор вкладок настраивает администратор, поэтому у вас их может быть больше или меньше.</p>` : role() === 'trainer' ? `

    ${fig('tools-passport', 'Паспорт танцора')}
    <p class="note">Набор вкладок настраивает администратор.</p>` : `
    <p>Менеджеру доступны вкладки: Telegram-бот и рассылки, Продления, Удержание, Оценки, Мероприятия, Залы, Замена тренера, Финансы, Фото и видео, Подбор пары, Паспорт танцора, Лига, Отчёт для HR. Как работает каждая — в разделах для администратора ниже; администратор может изменить набор вкладок в «Инструменты → Доступ».</p>

      <li><b>Фото и видео</b> — галерея занятий и турниров.</li></ul>`},
  {id: 'access', t: 'Доступ к инструментам и хранение', r: ['admin'], b: () => `
    <h3>Доступ к инструментам</h3>
    <p>«Инструменты → Доступ»: для менеджера, тренера и ученика отметьте вкладки, которые они видят. Сохраняется сразу для всех пользователей этой роли; закрытые вкладки исчезают и в меню, и на сервере. «Как было» — стандартный набор.</p>
    <h3>Где хранятся данные</h3>
    <ul><li>Вся база — в Google Таблице клуба (листы тренеров, учеников, абонементов, занятий и т.д.).</li>
      <li>Сканы договоров — папка «Договоры» на Google Диске, резервные копии — папка «Бэкапы».</li>
      <li>Фото профиля, фото и видео — отдельная папка «Медиа» и таблица «Медиа» (листы «Аватары» и «Галерея»). Ссылки — в «Инструменты → Фото и видео».</li>
      <li>corpdance.ru — только «обёртка» для удобного входа; данных там нет.</li></ul>
    <h3>Окно «Что нового»</h3>
    <p>Появляется у пользователей после обновлений системы — каждому только то, что касается его роли. Кнопка «＋ Своё сообщение» в этом окне — опубликовать объявление для выбранных ролей (о новом расписании, правилах клуба и т.п.): его покажут при следующем входе. Удалить — ссылка «удалить» у сообщения.</p>`},

function userForm(o) {
  o = o || {};
  const ex = o.id ? null : (S.D.users || []).find(u => (o.trainerId && u.trainerId === o.trainerId) || (o.clientId && u.clientId === o.clientId));
  if (ex) o = ex;
  const gen = () => Math.random().toString(36).slice(2, 6) + Math.floor(1000 + Math.random() * 9000);
  const translit = s => String(s || '').toLowerCase().split(/\s+/).slice(0, 2).reverse().join('.').replace(/[а-яё]/g, ch => ({а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'})[ch]).replace(/[^a-z0-9.]/g, '');
  const pass = o.id ? '' : gen();
  const bg = modal(o.id ? 'Пользователь' : 'Новый пользователь', `<div class="fg">
    ${fld('Роль', sel('role', Object.entries(ROLE), o.role || 'trainer'), 'full')}
    <div class="full" data-link></div>
    ${fld('Имя', inp('name', o.name || ''), 'full')}
    ${fld('Логин', inp('login', o.login || translit(o.name), 'autocapitalize="none"'))}
    ${fld(o.id ? 'Новый пароль (если нужно сбросить)' : 'Пароль', inp('password', pass, 'autocomplete="new-password"'))}
    ${o.id ? `<div class="full">${chk('active', 'Доступ разрешён', o.active)}</div>` : ''}
    <div class="full small muted">Передайте логин и пароль человеку. При первом входе приложение попросит сменить пароль.</div>
  </div>`, [o.id && o.id !== S.user.id ? {t: ic('trash') + 'Удалить', cls: 'danger', left: 1, fn: async () => { if (!(await askYes('Удалить пользователя ' + o.login + '? Он больше не сможет войти.'))) return false; await call('deleteUser', {id: o.id}); toast('Удалено'); await reload(); }} : null,
    {t: 'Отмена'}, {t: 'Сохранить', cls: 'pri', fn: async m => {
    const v = vals(m); v.id = o.id; if (!o.id) v.active = true;
    await call('saveUser', v); await reload();
    if (v.password) modal('Данные для входа', `<div class="card" style="background:var(--soft)">Логин: <b>${esc(v.login.toLowerCase())}</b><br>Пароль: <b>${esc(v.password)}</b></div><p class="small muted">Сохраните или отправьте эти данные — пароль больше не будет показан.</p>`, [{t: 'Готово', cls: 'pri'}]);
    else toast('Сохранено');
  }}].filter(Boolean));
  const link = () => {
    const r = $('[name=role]', bg).value;
    $('[data-link]', bg).innerHTML = r === 'trainer' ? fld('Карточка тренера', sel('trainerId', trOpts(true, '— выберите —'), o.trainerId || ''))
      : r === 'client' ? fld('Карточка ученика', sel('clientId', clOpts(S.D.clients, '— выберите —'), o.clientId || '')) : '';
    const s = $('[data-link] select', bg);
    if (s) s.onchange = () => { const n = s.options[s.selectedIndex].text; if (!$('[name=name]', bg).value) $('[name=name]', bg).value = n; if (!o.id) $('[name=login]', bg).value = translit(n); };
  };
  $('[name=role]', bg).onchange = link; link();
}

    : list === 'program' ? `<div class="fg">${fld('Название', inp('name', o.name), 'full')}${fld('Порядок', inp('order', o.order || '', 'type="number"'))}
      <div class="full">${chk('active', 'Активна', o.active !== false)}</div><div class="full small muted">При переименовании программа обновится у всех тренеров.</div></div>`
    : `<div class="fg">${fld('Название поля', inp('name', o.name, 'placeholder="Класс, разряд, размер костюма…"'), 'full')}
      ${fld('Для карточки', sel('kind', [['trainer', 'Тренера'], ['client', 'Ученика']], o.kind || 'trainer'))}
      ${fld('Тип', sel('mode', [['text', 'Текст'], ['number', 'Число'], ['date', 'Дата'], ['select', 'Выбор из списка'], ['check', 'Да / нет']], o.mode || 'text'))}
      ${fld('Варианты (для «выбор из списка», через запятую)', inp('options', o.options, 'placeholder="E, D, C, B, A, S, M"'), 'full')}
      ${fld('Порядок', inp('order', o.order || '', 'type="number"'))}

  ].filter(Boolean), {wide: list !== 'program'});
