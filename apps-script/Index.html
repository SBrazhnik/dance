// --- кабинет ученика ---
VIEWS.mysubs = () => {
  const D = S.D;
  const subs = D.subs.slice().sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || b.startDate.localeCompare(a.startDate));
  const act = subs.filter(s => (s.status || 'active') === 'active');
  const rem = sum(act.filter(s => s.remaining > 0 && s.state !== 'expired'), s => s.remaining);
  const myB = D.bookings.filter(b => b.status === 'booked' || b.status === 'wait').map(b => ({b, s: S.m.slots[b.slotId]})).filter(x => x.s && x.s.date >= today()).sort((a, b) => (a.s.date + a.s.time).localeCompare(b.s.date + b.s.time));
  const lessons = D.lessons.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const byT = {}; lessons.forEach(l => { byT[l.trainerId] = (byT[l.trainerId] || 0) + l.hours; });
  $('#main').innerHTML = `
    <div class="head"><h1>Здравствуйте, ${esc((S.user.name || '').split(' ')[1] || S.user.name)}!</h1><button class="btn pri" id="bk">${ic('cal')}Записаться</button></div>
    <div class="kpis"><div class="kpi"><b style="color:${rem <= (+D.settings.lowHours || 2) ? 'var(--bad)' : 'var(--navy)'}">${fh(rem)}</b><span>часов осталось</span></div>
      <div class="kpi"><b>${fh(sum(lessons, l => l.hours))}</b><span>часов занятий всего</span></div><div class="kpi"><b>${myB.length}</b><span>ближайших записей</span></div></div>
    ${rem <= (+D.settings.lowHours || 2) ? `<div class="card sect" style="background:var(--warnbg);border-color:#f0d9a8">${rem <= 0 ? 'Часы по абонементу закончились.' : 'Часы по абонементу заканчиваются.'} Обратитесь к администратору клуба, чтобы продлить абонемент.</div>` : ''}
    ${myB.length ? `<div class="sect"><h2>Мои записи</h2><div class="stack" style="margin-top:10px">${myB.map(x => `<div class="card tight slot"><div class="tm">${esc(x.s.time)}</div><div class="grow"><b>${wd(x.s.date)}, ${fd(x.s.date)}</b> · ${esc(x.s.title)}<div class="small muted">${esc(tName(x.s.trainerId))} · ${fh(x.s.hours)} ч${x.b.status === 'wait' ? ' · <b>лист ожидания</b>' : ''}</div></div><button class="btn sm danger" data-cb="${x.b.id}">${x.b.status === 'wait' ? 'Выйти' : 'Отменить'}</button></div>`).join('')}</div></div>` : ''}
    <div class="sect"><h2>Абонементы</h2><div class="card" style="margin-top:10px">${subs.map(s => subBlock(s)).join('') || empty('Абонементов пока нет')}</div></div>
    ${Object.keys(byT).length ? `<div class="sect"><h2>С кем я занимался</h2><div class="card" style="margin-top:10px"><div class="hbars">${Object.keys(byT).map(t => `<div class="hb"><span>${esc(tName(t))}</span><div class="bar"><i style="width:${byT[t] / Math.max(...Object.values(byT)) * 100}%"></i></div><span class="right"><b>${fh(byT[t])} ч</b></span></div>`).join('')}</div></div></div>` : ''}
    <div class="sect"><h2>История занятий</h2><div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Дата</th><th>Тренер</th><th>Тип</th><th class="n">Часов</th></tr></thead><tbody>
      ${lessons.map(l => `<tr><td>${fd(l.date)} <span class="muted">${esc(l.time)}</span></td><td>${esc(tName(l.trainerId))}</td><td>${TYPE[l.type]}${l.eventId ? ': ' + esc(l.notes) : ''}</td><td class="n">${fh(l.hours)}</td></tr>`).join('') || `<tr><td colspan="4">${empty('Занятий пока не было')}</td></tr>`}
    </tbody></table></div></div>`;
  $('#bk').onclick = () => go('booking');
  $$('[data-cb]').forEach(b => b.onclick = async () => { if (!(await askYes('Отменить запись?'))) return; try { await call('cancelBooking', {id: b.dataset.cb}); toast('Запись отменена'); await reload(); } catch (e) { fail(e); } });
};
VIEWS.booking = () => {
  const ui = S.ui.bk || (S.ui.bk = {tr: ''});
  const D = S.D;
  const mine = {}; D.bookings.filter(b => b.status === 'booked' || b.status === 'wait').forEach(b => { mine[b.slotId] = b; });
  const slots = D.slots.filter(s => s.date >= today() && (!ui.tr || s.trainerId === ui.tr)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const days = [...new Set(slots.map(s => s.date))];
  $('#main').innerHTML = `<div class="head"><h1>Запись на занятие</h1>${sel('tr', [['', 'Все тренеры']].concat(D.trainers.map(t => [t.id, t.name])), ui.tr, 'id="btr" style="width:auto"')}</div>
    ${days.map(d => `<div class="day"><h3>${wd(d)}, ${fd(d)}${d === today() ? ' · сегодня' : ''}</h3><div class="stack">${slots.filter(s => s.date === d).map(s => {
      const free = s.capacity - s.booked; const b = mine[s.id];
      return `<div class="card tight slot"><div class="tm">${esc(s.time)}</div><div class="grow"><b>${esc(s.title)}</b><div class="small muted">${esc(tName(s.trainerId))} · ${TYPE[s.type]} · ${fh(s.hours)} ч${s.type === 'group' ? ' · свободно ' + Math.max(0, free) + ' из ' + s.capacity : ''}</div></div>
        ${b ? `<div class="right"><span class="badge ${b.status === 'wait' ? 'warn' : 'ok'}">${b.status === 'wait' ? 'Лист ожидания' : 'Вы записаны'}</span><br><button class="btn sm danger" style="margin-top:6px" data-cb="${b.id}">${b.status === 'wait' ? 'Выйти' : 'Отменить'}</button></div>` : free > 0 ? `<button class="btn sm pri" data-bk="${s.id}">Записаться</button>` : `<div class="right"><span class="badge">Мест нет</span><br><button class="btn sm" style="margin-top:6px" data-wt="${s.id}">В лист ожидания</button></div>`}</div>`;
    }).join('')}</div></div>`).join('') || `<div class="card">${empty('Свободных слотов пока нет. Загляните позже или свяжитесь с тренером.')}</div>`}`;
  $('#btr').onchange = e => { ui.tr = e.target.value; VIEWS.booking(); };
  $$('[data-bk]').forEach(b => b.onclick = async () => { try { await call('book', {slotId: b.dataset.bk}); toast('Вы записаны!'); await reload(); } catch (e) { fail(e); } });
  $$('[data-wt]').forEach(b => b.onclick = async () => { try { const r = await call('joinWait', {slotId: b.dataset.wt}); toast(r.booked ? 'Место освободилось — вы записаны!' : 'Вы в листе ожидания, №' + r.pos + '. Если место освободится, мы запишем вас автоматически'); await reload(); } catch (e) { fail(e); } });
  $$('[data-cb]').forEach(b => b.onclick = async () => { if (!(await askYes('Отменить запись?'))) return; try { await call('cancelBooking', {id: b.dataset.cb}); toast('Запись отменена'); await reload(); } catch (e) { fail(e); } });
};

const AV = {v: {}, d: {}};

function avApply(root) {
  if (!root || !root.querySelectorAll) return;
  const els = $$('[data-av]', root); if (root.dataset && root.dataset.av) els.push(root);
  els.forEach(el => {

async function avLoad() {
  try {

    Object.keys(AV.d).forEach(k => { if (!(k in r.v)) delete AV.d[k]; });

new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) avApply(n); }))).observe(document.body, {childList: true, subtree: true});
document.addEventListener('click', e => { const a = e.target.closest('.avatar.edit[data-av]'); if (a) { e.stopPropagation(); avatarMenu(a.dataset.av, a.dataset.avn || ''); } });
function loadImg(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Не удалось прочитать файл'));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error('Это не изображение или формат не поддерживается (попробуйте JPG или PNG)')); img.onload = () => res(img); img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
/** Окно кадрирования: двигайте фото пальцем или мышью, масштаб — ползунком. Возвращает JPEG до ~45 КБ или null. */
function cropAvatar(img) {
  return new Promise(resolve => {
    const V = 260, OUT = 200;
    let done = false;
    const st = {z: 1, x: 0, y: 0};
    const base = V / Math.min(img.width, img.height);
    const bg = modal('Кадрирование', `<p class="small muted" style="margin-top:0">Передвиньте фото так, чтобы лицо было в круге. Ползунок — приблизить.</p>
      <div style="display:flex;justify-content:center"><canvas id="cpc" width="${V * 2}" height="${V * 2}" style="width:${V}px;height:${V}px;border-radius:50%;touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--line);background:#eee"></canvas></div>
      <div class="row" style="margin-top:14px;gap:10px"><span>−</span><input type="range" id="cpz" min="1" max="4" step="0.01" value="1" class="grow"><span>+</span></div>`,
    [{t: 'Отмена', fn: () => { done = true; resolve(null); }}, {t: 'Сохранить', cls: 'pri', fn: () => { done = true; resolve(render(OUT, true)); }}]);
    const cv = $('#cpc', bg), g = cv.getContext('2d');
    const clamp = () => {
      const k = base * st.z, w = img.width * k, h = img.height * k;
      st.x = Math.min(0, Math.max(V - w, st.x)); st.y = Math.min(0, Math.max(V - h, st.y));
    };
    function render(size, out) {
      const c = out ? document.createElement('canvas') : cv, sc = (out ? size : V * 2) / V;
      if (out) { c.width = c.height = size; }
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      const k = base * st.z * sc;
      x.drawImage(img, st.x * sc, st.y * sc, img.width * k, img.height * k);
      if (!out) return null;
      let q = 0.88, d = c.toDataURL('image/jpeg', q);
      while (d.length > 45000 && q > 0.4) { q -= 0.08; d = c.toDataURL('image/jpeg', q); }
      return d;
    }
    st.x = (V - img.width * base) / 2; st.y = (V - img.height * base) / 2; clamp(); render();
    const zoom = (nz, cx, cy) => {
      const k0 = base * st.z; st.z = Math.max(1, Math.min(4, nz)); const k1 = base * st.z;
      st.x = cx - (cx - st.x) * k1 / k0; st.y = cy - (cy - st.y) * k1 / k0; clamp(); render(); $('#cpz', bg).value = st.z;
    };
    $('#cpz', bg).oninput = e => zoom(+e.target.value, V / 2, V / 2);
    let drag = null;
    cv.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, sx: st.x, sy: st.y}; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
    cv.addEventListener('pointermove', e => { if (!drag) return; st.x = drag.sx + e.clientX - drag.x; st.y = drag.sy + e.clientY - drag.y; clamp(); render(); });
    cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'grab'; });
    cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(st.z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); }, {passive: false});
    new MutationObserver((ms, o) => { if (!document.body.contains(bg)) { o.disconnect(); if (!done) resolve(null); } }).observe(document.body, {childList: true});
  });
}
function avatarMenu(key, name) {
  const [kind, refId] = key.split(':');
  const has = !!AV.d[key];
  const bg = modal('Фото: ' + esc(name || ''), `<div class="row" style="gap:16px;align-items:center">
      <div class="avatar ${kind === 'client' ? 'c' : ''}" data-av="${key}" id="avpv" style="width:96px;height:96px;font-size:30px">${initials(name)}</div>
      <div class="grow small muted">Выберите фотографию с телефона или компьютера, затем передвиньте её так, чтобы лицо было в круге. Фото видно в карточках, списках и на Главной на всех устройствах.</div></div>
    <label class="btn pri" style="margin-top:14px;position:relative;overflow:hidden;cursor:pointer">📷 Выбрать фото<input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" id="avf" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>`,
  [has ? {t: ic('trash') + 'Удалить', cls: 'danger', left: 1, fn: async () => { await call('avatarDel', {kind, refId}, true); delete AV.d[key]; delete AV.v[key]; avSave(); avApply(document.body); toast('Фото удалено'); }} : null,

      const pv = $('#avpv', bg); if (pv) { pv.style.backgroundImage = 'url("' + data + '")'; pv.classList.add('ph'); }
      const v = await call('avatarSet', {kind, refId, data}, true);
      AV.d[key] = data; AV.v[key] = v; avSave(); avApply(document.body);
      toast('Фото сохранено');

  };
}
